<title>Banda del Jagger</title>
<style>
:root{color-scheme:dark;--bg:#0d0d15;--panel:#151522;--panel2:#1c1b2b;--line:#302d45;--text:#f5f3ff;--muted:#aaa5c2;--purple:#9b6dff;--cyan:#5ce1e6;--danger:#ff6f91;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#292044 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:980px;margin:auto;min-height:100vh;padding-bottom:90px}.top{display:flex;align-items:center;gap:12px;padding:18px 18px 12px;position:sticky;top:0;z-index:5;background:#0d0d15eF;backdrop-filter:blur(14px);border-bottom:1px solid #28253a}
.logo {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 14px;
  overflow: hidden;
  background: linear-gradient(135deg, var(--purple), #6542c6);
  box-shadow: 0 8px 24px #8d5cff30;
}

.logo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}.brand{flex:1}.brand b{display:block;font-size:17px;letter-spacing:.1px}.brand small{color:var(--muted)}.user-area{display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel2)}.content{padding:22px 18px;min-height:70vh}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;justify-content:center;gap:3px;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));background:#11111bef;border-top:1px solid var(--line);backdrop-filter:blur(16px)}.navitem{border:0;background:transparent;color:var(--muted);border-radius:13px;padding:8px 10px;min-width:58px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;flex:1;max-width:150px}.navitem .ico{font-size:20px;line-height:1.2}.navitem.active{background:#302344;color:#e8d9ff}.navitem.active .ico{color:var(--cyan)}
h1,h2,h3,p{margin-top:0}h1{font-size:clamp(25px,5vw,34px);line-height:1.16;letter-spacing:-.7px;margin-bottom:9px}h2{font-size:20px;margin-bottom:12px}h3{font-size:16px;margin-bottom:5px}.muted,small{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;color:var(--cyan);font-size:11px;font-weight:800}.hero{padding:24px;border:1px solid #47336b;border-radius:24px;background:linear-gradient(130deg,#2a1c44,#171827 68%);margin-bottom:22px;position:relative;overflow:hidden}.hero:after{content:"♛";position:absolute;right:16px;bottom:-32px;font-size:150px;color:#ffffff08;pointer-events:none}.hero p{color:#c7c1db;max-width:560px;margin-bottom:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:1px solid transparent;border-radius:12px;padding:10px 15px;background:linear-gradient(135deg,#a37bff,#7950df);color:white;font-weight:750;box-shadow:0 5px 16px #8050e82b}.btn.secondary{background:var(--panel2);border-color:var(--line);box-shadow:none;color:var(--text)}.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--muted)}.btn.danger{background:#4a202f;border-color:#7a334b;box-shadow:none;color:#ffc2d0}.btn.full{width:100%}.back{border:0;background:none;color:var(--cyan);padding:0;margin-bottom:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tile,.card{background:linear-gradient(160deg,#191927,#14141f);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}.tile{text-align:left;display:flex;flex-direction:column;gap:7px;color:var(--text);min-height:125px}.tile .ico{font-size:24px;color:var(--cyan)}.tile small{line-height:1.4}.card{margin-bottom:12px}.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11px;color:#d8c9ff;background:#211c31}.options{display:grid;gap:8px;margin:14px 0}.option{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#1b1a29}.option input{accent-color:var(--purple);width:17px;height:17px}.voters{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.voter{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:20px;background:#262338;border:1px solid #3c3556;font-size:12px;color:#ddd5f0}.voter img,.voter i{width:20px;height:20px;border-radius:50%;object-fit:cover;background:#302d43;display:grid;place-items:center;font-style:normal;font-size:11px}.voter b{color:var(--cyan);font-weight:600}.bar{height:6px;background:#302d43;border-radius:20px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:20px}.formrow{margin-bottom:15px}.formrow label{display:block;font-size:13px;color:#d9d4e9;font-weight:700;margin-bottom:7px}.field{width:100%;background:#10101a;border:1px solid #3a3650;border-radius:12px;padding:12px;color:var(--text);outline:none}.field:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9b6dff22}textarea.field{min-height:90px;resize:vertical}.notice{padding:12px 14px;border:1px solid #3c3556;border-radius:12px;color:#c8c1dc;background:#191725;font-size:13px;margin-top:14px}.empty{padding:28px 18px;text-align:center;border:1px dashed #45405b;border-radius:16px;color:var(--muted)}.empty .big{font-size:30px;margin-bottom:8px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#f2edff;color:#1a1527;padding:11px 17px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0007;max-width:calc(100% - 28px);font-weight:700}.hide{display:none!important}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:15px}.daylabel,.day{font-size:12px;text-align:center}.daylabel{color:var(--muted);padding:5px 0}.day{border:1px solid transparent;background:#191927;color:var(--text);border-radius:10px;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.day.selected{border-color:var(--cyan);background:#183034}.day.today{box-shadow:inset 0 0 0 1px var(--purple)}.dot{width:4px;height:4px;border-radius:50%;background:var(--cyan)}.event-date{font-size:12px;color:var(--cyan);font-weight:800}.linkurl{overflow-wrap:anywhere;color:var(--cyan);font-size:13px}.loginbox{max-width:520px;margin:5vh auto}.loginbox .hero{padding:28px}.gbtn{width:100%;background:#f7f6fb;color:#222;border:0;border-radius:12px;padding:13px;font-weight:800}.spinner{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.profileline{display:flex;gap:12px;align-items:center}.subtle{font-size:13px;color:var(--muted)}.admin-label{font-size:11px;color:#ffc1d0}.pillbtn{border:1px solid var(--line);border-radius:9px;background:#211e30;color:#dcd5f0;padding:6px 9px;font-size:12px}
@media(min-width:720px){.content{padding:30px 24px}.hero{padding:30px}.bottom{top:80px;bottom:auto;left:max(calc((100vw - 980px)/2 + 18px),18px);right:auto;width:160px;display:flex;flex-direction:column;align-items:stretch;border:1px solid var(--line);border-radius:17px;padding:8px;background:#12121def}.navitem{flex-direction:row;max-width:none;justify-content:flex-start;gap:12px;padding:12px;font-size:13px}.navitem .ico{width:24px;text-align:center}.content{margin-left:175px}.app{padding-bottom:20px}.toast{bottom:25px}.user-area .subtle{display:block}}
@media(max-width:440px){.grid{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.brand small{font-size:11px}.top{padding:12px}.user-area .subtle{display:none}.content{padding:18px 13px}.hero{padding:19px}.bottom{gap:0}.navitem{padding:7px 3px;min-width:0;font-size:10px}}
  /* Selector de emojis para eventos: 2 filas x 4 columnas */
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-top: 8px;
}

.emoji-option {
  min-width: 0;
  cursor: pointer;
}

.emoji-option input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.emoji-option span {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 76px;
  padding: 8px 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--panel2);
  color: var(--text);
  font-size: 12px;
  text-align: center;
}

.emoji-option .emoji-icon {
  font-size: 25px;
  line-height: 1.2;
}

.emoji-option input:checked + span {
  border-color: var(--cyan);
  background: #183034;
  box-shadow: 0 0 0 1px var(--cyan);
}
.wheel-card{text-align:center}.wheel-wrap{position:relative;max-width:340px;margin:0 auto 14px}.wheel-svg{width:100%;height:auto;display:block}.wheel-svg #wheelSpin{transform-origin:160px 160px}.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:2;font-size:26px;color:var(--text);text-shadow:0 2px 6px #000}.wheel-empty{aspect-ratio:1;display:grid;place-items:center;border:2px dashed var(--line);border-radius:50%;color:var(--muted);padding:30px}.wheel-result{font-size:22px;margin:4px 0 14px}.wheel-result.hide{display:none}.btn:disabled{opacity:.55;cursor:not-allowed}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">
  <img src="./logo-jagger.png" alt="Logo de Banda del Jagger">
  </div><div class="brand"><b>Banda del Jagger</b><small>Si vas a hacerla bien, hacela bien</small></div>
  <div class="user-area" id="userArea"></div>
</header>
<main id="main" class="content"><div class="empty"><span class="spinner"></span><p style="margin:10px 0 0">Preparando la banda…</p></div></main>
<nav class="bottom" id="bottom"></nav>
</div>
<div id="toast" class="toast hide" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL = 'https://iomqmnxzcbxepkdbhomz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SwTp5a9Q2xCSJiccZRCqpg_rf8bl289';
const CONFIGURED = SUPABASE_ANON_KEY !== 'PEGAR_AQUI_TU_PUBLISHABLE_KEY' && SUPABASE_ANON_KEY.trim().length > 20;
const navs=[['Inicio','⌂'],['Votaciones','☑'],['Herramientas','🧰'],['Calendario','▦'],['Enlaces','↗']];
let db=null, session=null, profile=null, isAdmin=false, page='Inicio', currentPoll=null, selectedDate='', calendarMonth='', toastTimer=null;
let data={polls:[],options:[],votes:[],results:[],voters:{},ideas:[],events:[],links:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'';
const localISO=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
  selectedDate=localISO(new Date());calendarMonth=selectedDate.slice(0,7);

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hide'),3000)}
function friendlyError(e){const m=e?.message||String(e||'Ocurrió un error');console.error(e);if(/row-level security|permission denied/i.test(m))return 'La base de datos bloqueó esta acción por permisos. Revisá que el SQL de configuración esté aplicado.';if(/duplicate key|unique constraint/i.test(m))return 'Ya existe un registro equivalente o ya votaste en esta opción.';return m}
function showError(e){toast(friendlyError(e))}
const NAV_PARENT={'Propuestas':'Herramientas','Nueva propuesta':'Herramientas','Ruleta':'Herramientas','Crear votación':'Votaciones','Detalle':'Votaciones','Crear evento':'Calendario','Nuevo enlace':'Enlaces'};
function nav(){const cur=NAV_PARENT[page]||page; $('bottom').innerHTML=navs.map(([n,i])=>`<button class="navitem ${cur===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span><span>${n}</span></button>`).join('') }
function userArea(){if(!session){$('userArea').innerHTML='';return}const name=profile?.full_name||session.user.user_metadata?.full_name||session.user.email||'Integrante';const pic=profile?.avatar_url||session.user.user_metadata?.avatar_url;$('userArea').innerHTML=`${pic?`<img class="avatar" src="${esc(pic)}" alt="">`:`<div class="avatar" style="display:grid;place-items:center">👤</div>`}<span class="subtle">${esc(name.split(' ')[0])}${isAdmin?' · Admin':''}</span><button class="pillbtn" onclick="signOut()">Salir</button>`}
async function go(p){page=p;nav();await render()}
async function signIn(){if(!db)return toast('Primero configurá la clave pública de Supabase en el archivo.');const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});if(error)showError(error)}
async function signOut(){if(db){const {error}=await db.auth.signOut();if(error)showError(error)}}
async function loadAll(){
 const tasks=[
  ['polls','polls',true],['options','poll_options',false],
  ['ideas','proposals',true],['events','calendar_events',true],['links','shared_links',true]
 ];
 const results=await Promise.all(tasks.map(async ([key,table,hasCreatedAt])=>{let q=db.from(table).select('*');if(hasCreatedAt)q=q.order('created_at',{ascending:false});const {data,error}=await q.limit(500);if(error)throw error;return [key,data||[]]}));
 results.forEach(([k,v])=>data[k]=v);

 // Los resultados se consultan mediante una función segura que devuelve solo agregados.
 const [summaryGroups, ownResult] = await Promise.all([
  Promise.all(data.polls.map(async poll => {
   const {data: rows, error} = await db.rpc('get_vote_results', {
    p_poll_id: poll.id
   });
   if (error) throw error;
   return rows || [];
  })),
  db.from('votes')
   .select('id,poll_id,option_id,voter_id,ranking_position,created_at')
   .eq('voter_id', session.user.id)
   .limit(500)
 ]);
 if (ownResult.error) throw ownResult.error;
 data.results = summaryGroups.flat();
 data.votes = ownResult.data || [];

 // Votaciones públicas: se pide quién votó qué. La base de datos no devuelve nada para las anónimas.
 data.voters = {};
 await Promise.all(data.polls.filter(p => !p.anonymous).map(async poll => {
  const {data: rows, error} = await db.rpc('get_poll_voters', {p_poll_id: poll.id});
  if (error) { console.error('Error consultando get_poll_voters:', error); data.voters[poll.id] = null; return; }
  data.voters[poll.id] = rows || [];
 }));

}
async function refresh(){if(!session){data={polls:[],options:[],votes:[],results:[],voters:{},ideas:[],events:[],links:[]};userArea();nav();await render();return}
 try{const {data:admins,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error)console.error('Error consultando admin_users:',error);isAdmin=!!admins;await loadAll();userArea();await render()}catch(e){showError(e);userArea();await render()}}
function heading(kicker,title,desc=''){return `<div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1>${desc?`<p class="muted">${esc(desc)}</p>`:''}`}
function empty(icon,title,desc,button=''){return `<div class="empty"><div class="big">${icon}</div><b>${esc(title)}</b><p>${esc(desc)}</p>${button}</div>`}
function canDelete(owner){return isAdmin||(!!owner&&owner===session?.user?.id)}
function delButton(table,id,owner){return canDelete(owner)?`<button class="btn danger" onclick="removeItem('${table}','${id}')">Eliminar</button>`:''}
function countVotes(pollId){return Number(data.results.find(v=>v.poll_id===pollId)?.total_voters||0)}
function voterChip(v){const name=v.voter_name||'Integrante';return `<span class="voter">${v.avatar_url?`<img src="${esc(v.avatar_url)}" alt="">`:`<i>👤</i>`}${v.ranking_position?`<b>${Number(v.ranking_position)}°</b>`:''}${esc(name)}</span>`}
function peopleLabel(n){return n===1?'1 persona votó':`${n} personas votaron`}
function pollOptions(pollId){return data.options.filter(o=>o.poll_id===pollId)}
function pollCard(p){const opts=pollOptions(p.id),total=countVotes(p.id);return `<article class="card"><div class="card-top"><div><span class="tag">${p.anonymous?'🕶 Anónima':'👥 Pública'} · ${esc(p.poll_type)}</span><h3 style="margin-top:10px">${esc(p.title)}</h3></div>${delButton('polls',p.id,p.created_by)}</div><p class="muted">${esc(p.description||'Votá y ayudá a decidir el próximo plan.')}</p><div class="row"><span class="subtle">${opts.length} opciones</span><span class="subtle">· ${peopleLabel(total)}</span></div><div class="row" style="margin-top:14px"><button class="btn" onclick="openPoll('${p.id}')">Ver votación</button></div></article>`}
function home(){const now=new Date();const limit=new Date(now);limit.setDate(limit.getDate()+15);const upcoming=[...data.events].filter(e=>{if(!e.starts_at)return false;const date=new Date(e.starts_at);return date>=now&&date<=limit}).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)).slice(0,3);
return `${heading('El grupo se organiza','¡Aloha!','Un solo lugar para decidir, proponer y organizar los próximos planes.') }<section class="hero"><div class="eyebrow">Banda del Jagger</div><h1>Los mejores planes<br>se arman entre todos.</h1><p>Votá, tirá ideas y organizá las juntadas. Todo queda guardado y compartido.</p><div class="row"><button class="btn" onclick="go('Votaciones')">Ver votaciones</button><button class="btn secondary" onclick="go('Calendario')">Abrir calendario</button></div></section><div class="tiles"><button class="tile" onclick="go('Votaciones')"><span class="ico">☑</span><b>Votaciones</b><small>${data.polls.length} activas</small></button><button class="tile" onclick="go('Propuestas')"><span class="ico">💡</span><b>Propuestas</b><small>${data.ideas.length} ideas de la banda</small></button><button class="tile" onclick="go('Calendario')"><span class="ico">▦</span><b>Calendario</b><small>${data.events.length} eventos</small></button><button class="tile" onclick="go('Enlaces')"><span class="ico">↗</span><b>Enlaces</b><small>${data.links.length} recursos compartidos</small></button></div><div class="section-head"><h2>Próximos planes</h2><button class="btn secondary" onclick="go('Calendario')">Ver todos</button></div>${upcoming.length?upcoming.map(eventCard).join(''):empty('📅','Todavía no hay planes','Creá un evento para que aparezca acá.')}<div class="notice">Conectado a una base de datos compartida. Tus publicaciones quedan visibles para los integrantes que iniciaron sesión.</div>`}
function pollsPage(){return `${heading('Decisiones grupales','Votaciones','Elegí una opción, marcá varias o completá un ranking.') }<div class="row" style="margin:16px 0 20px"><button class="btn" onclick="go('Crear votación')">＋ Nueva votación</button></div>${data.polls.length?data.polls.map(pollCard).join(''):empty('☑','No hay votaciones todavía','Sé el primero en proponer una decisión.','<button class="btn" onclick="go(\'Crear votación\')">Crear votación</button>')}`}
function openPoll(id){currentPoll=id;go('Detalle')}
function pollDetail(){const p=data.polls.find(x=>x.id===currentPoll);if(!p)return `${heading('Votaciones','No se encontró la votación')}<button class="btn secondary" onclick="go('Votaciones')">Volver</button>`;const opts=pollOptions(p.id);const my=data.votes.filter(v=>v.poll_id===p.id&&v.voter_id===session.user.id);const mode=p.poll_type||'simple';const voters=p.anonymous?[]:data.voters[p.id];return `<button class="back" onclick="go('Votaciones')">← Volver a votaciones</button>${heading(p.anonymous?'Votación anónima':'Votación pública',p.title,p.description||'Tu voto ayuda a decidir.') }<div class="card"><span class="tag">${esc(mode)}</span><div class="options" id="choices">${opts.map((o,i)=>mode==='ranking'?`<label class="option"><span style="flex:1">${esc(o.label)}</span><select class="field rank-choice" data-option="${esc(o.id)}" style="width:95px;padding:7px"><option value="">—</option>${opts.map((_,n)=>`<option value="${n+1}" ${my.find(v=>v.option_id===o.id)?.ranking_position===n+1?'selected':''}>${n+1}°</option>`).join('')}</select></label>`:`<label class="option"><input ${mode==='multiple'?'type="checkbox"':'type="radio"'} name="choice" value="${esc(o.id)}" ${my.some(v=>v.option_id===o.id)?'checked':''}><span>${esc(o.label)}</span></label>`).join('')}</div>${p.anonymous?'':'<p class="subtle">👥 Votación pública: el resto del grupo verá lo que votes.</p>'}${my.length?'<p class="subtle">Ya registraste tu voto. Si votás de nuevo, se reemplazará tu selección.</p>':''}<button class="btn full" onclick="submitVote('${p.id}','${esc(mode)}')">Guardar mi voto</button></div><h2>Resultados</h2><p class="muted"><b>${peopleLabel(countVotes(p.id))}</b>${p.anonymous?' · votación anónima, no se muestra quién votó.':''}</p>${opts.map(o=>{const summary=data.results.find(v=>v.option_id===o.id);const n=Number(summary?.vote_count||0);const total=Number(summary?.total_selections||0);const pct=total?Math.round(n/total*100):0;const who=voters?voters.filter(v=>v.option_id===o.id).sort((a,b)=>(a.ranking_position||0)-(b.ranking_position||0)):[];return `<div class="card" style="padding:12px 14px"><div class="card-top"><span>${esc(o.label)}</span><b>${n}</b></div><div class="bar"><span style="width:${pct}%"></span></div><small>${pct}% de las selecciones</small>${who.length?`<div class="voters">${who.map(voterChip).join('')}</div>`:''}</div>`}).join('')}${canDelete(p.created_by)?`<div class="row">${delButton('polls',p.id,p.created_by)}</div>`:''}<div class="notice">${p.anonymous?'Votación anónima: solo se muestra cuántas personas votaron y los totales por opción. Nadie, ni siquiera los administradores desde la app, puede ver quién votó qué.':voters===null?'Votación pública, pero no se pudo cargar quién votó. Revisá que la función <code>get_poll_voters</code> esté creada en Supabase.':'Votación pública: todos los integrantes pueden ver quién votó cada opción.'}</div>`}
async function submitVote(pollId,mode){const p=data.polls.find(x=>x.id===pollId);if(!p)return;let selected=[],positions={};if(mode==='ranking'){const picks=[...document.querySelectorAll('#choices .rank-choice')].map(x=>({id:x.dataset.option,pos:x.value?Number(x.value):null})).filter(x=>x.pos!==null);const seen=new Set(picks.map(x=>x.pos));if(picks.length<2)return toast('Ordená al menos dos opciones.');if(seen.size!==picks.length)return toast('No repitas posiciones en el ranking.');picks.sort((a,b)=>a.pos-b.pos);selected=picks.map(x=>x.id);positions=Object.fromEntries(picks.map(x=>[x.id,x.pos]));}else{selected=[...document.querySelectorAll('#choices input:checked')].map(x=>x.value);if(mode==='simple'&&selected.length>1)selected=selected.slice(0,1)}if(!selected.length)return toast('Elegí al menos una opción.');try{const rows=selected.map(option_id=>({option_id,ranking_position:mode==='ranking'?positions[option_id]:null}));const {error}=await db.rpc('cast_vote',{p_poll_id:pollId,p_votes:rows});if(error)throw error;toast('¡Voto registrado!');await refresh()}catch(e){showError(e)}}
function createPoll(){return `<button class="back" onclick="go('Votaciones')">← Volver</button>${heading('Nueva decisión','Crear votación','La pregunta y las opciones quedarán compartidas con toda la banda.')}<form onsubmit="savePoll(event)" class="card"><div class="formrow"><label for="ptitle">Pregunta</label><input class="field" id="ptitle" maxlength="140" required placeholder="Ej.: ¿Qué hacemos este finde?"></div><div class="formrow"><label for="pdesc">Descripción (opcional)</label><textarea class="field" id="pdesc" maxlength="500" placeholder="Agregá contexto o detalles…"></textarea></div><div class="formrow"><label for="pmode">Tipo de votación</label><select class="field" id="pmode"><option value="simple">Voto simple (una opción)</option><option value="multiple">Voto múltiple (varias opciones)</option><option value="ranking">Ranking (orden de preferencia)</option></select></div><div class="formrow"><label for="poptions">Opciones (una por línea, mínimo 2)</label><textarea class="field" id="poptions" required placeholder="Fútbol 5&#10;Pizza y birra&#10;Asado en el parque"></textarea></div><div class="formrow"><label for="pprivacy">Tipo de poll</label><select class="field" id="pprivacy"><option value="true">🕶 Anónima (solo se ve cuántas personas votaron)</option><option value="false">👥 Pública (se ve quién votó cada opción)</option></select></div><button class="btn full">Publicar votación</button></form>`}
async function savePoll(e){e.preventDefault();const title=$('ptitle').value.trim(),description=$('pdesc').value.trim(),poll_type=$('pmode').value,anonymous=$('pprivacy').value==='true';const labels=$('poptions').value.split('\n').map(s=>s.trim()).filter(Boolean);if(labels.length<2)return toast('Agregá al menos dos opciones.');if(labels.length>30)return toast('Usá como máximo 30 opciones.');try{const {error}=await db.rpc('create_poll',{p_title:title,p_description:description||null,p_poll_type:poll_type,p_anonymous:anonymous,p_options:labels});if(error)throw error;toast('¡Votación publicada!');await refresh();page='Votaciones';await render()}catch(e){showError(e)}}
function proposalsPage(){return `<button class="back" onclick="go('Herramientas')">← Herramientas</button>${heading('Ideas de la banda','Propuestas','Cualquier integrante puede sumar una idea para el próximo plan.')}<div class="row" style="margin:16px 0 20px"><button class="btn" onclick="go('Nueva propuesta')">＋ Nueva propuesta</button></div>${data.ideas.length?data.ideas.map(p=>`<article class="card"><div class="card-top"><div><h3>💡 ${esc(p.title)}</h3><p class="muted">${esc(p.description||'Sin descripción adicional.')}</p><small>Propuesta por ${esc(p.proposed_by?shortUser(p.proposed_by):'un integrante')} · ${fmtDate((p.created_at||'').slice(0,10))}</small></div>${delButton('proposals',p.id,p.proposed_by)}</div></article>`).join(''):empty('💡','Todavía no hay propuestas','Sumá una idea y compartila con tus amigos.','<button class="btn" onclick="go(\'Nueva propuesta\')">Crear propuesta</button>')}`}

function createIdea(){return `<button class="back" onclick="go('Propuestas')">← Volver</button>${heading('Nueva idea','Crear propuesta','Compartí el plan que te gustaría hacer.')}<form onsubmit="saveIdea(event)" class="card"><div class="formrow"><label for="ititle">¿Qué proponés?</label><input class="field" id="ititle" maxlength="140" required placeholder="Ej.: Escapada a la costa"></div><div class="formrow"><label for="idesc">Contanos un poco más</label><textarea class="field" id="idesc" maxlength="1000" placeholder="Fecha, lugar, idea general…"></textarea></div><button class="btn full">Publicar propuesta</button></form>`}
async function saveIdea(e){e.preventDefault();try{const {error}=await db.from('proposals').insert({title:$('ititle').value.trim(),description:$('idesc').value.trim()||null,proposed_by:session.user.id});if(error)throw error;toast('¡Propuesta publicada!');await refresh();page='Propuestas';await render()}catch(e){showError(e)}}
function eventCard(e) {
  const date = e.starts_at ? new Date(e.starts_at) : null;
  const rawTitle = String(e.title || '');

  const match = rawTitle.match(
    /^(📅|⚽|🍕|🎂|🍻|🏠|🎮|🎉)\s*/u
  );

  const emoji = match ? match[1] : '📅';
  const title = match
    ? rawTitle.slice(match[0].length)
    : rawTitle;

  return `<article class="card">
    <div class="card-top">
      <div>
        <div class="event-date">
          ${date ? date.toLocaleDateString('es-AR', {
            weekday: 'short',
            day: 'numeric',
            month: 'long',
            hour: '2-digit',
            minute: '2-digit'
          }) : 'Fecha a confirmar'}
        </div>
        <h3 style="margin-top:5px">
          ${emoji} ${esc(title)}
        </h3>
        <p class="muted">
          ${esc(e.description || 'Detalles a confirmar')}
        </p>
      </div>
      ${delButton('calendar_events', e.id, e.created_by)}
    </div>
  </article>`;
}
function eventsPage(){
  const today=new Date();
  today.setHours(0,0,0,0);

  const limit=new Date(today);
  limit.setDate(limit.getDate()+15);
  limit.setHours(23,59,59,999);

  const upcoming=[...data.events]
    .filter(e=>{
      if(!e.starts_at)return false;
      const date=new Date(e.starts_at);
      return !isNaN(date.getTime())&&date>=today&&date<=limit;
    })
    .sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));

  return `${heading('Que no se nos pase','Calendario compartido','Un calendario único para los planes de toda la banda.')}<div class="row" style="margin:16px 0"><button class="btn" onclick="go('Crear evento')">＋ Agregar evento</button></div>${calendar()}<div class="section-head"><h2>Todos los eventos</h2></div>${upcoming.length?upcoming.map(eventCard).join(''):empty('📅','No hay próximos eventos','No hay eventos programados para los próximos 15 días.')}`;
}

function calendar(){const [y,m]=calendarMonth.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,days=new Date(y,m,0).getDate(),labels=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];let cells=labels.map(x=>`<div class="daylabel">${x}</div>`).join('');for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=data.events.some(e=>e.starts_at&&localISO(new Date(e.starts_at))===key);cells+=`<button class="day ${selectedDate===key?'selected':''} ${key===localISO(new Date())?'today':''}" onclick="selectDate('${key}')">${d}${has?'<span class="dot"></span>':''}</button>`}const monthName=first.toLocaleDateString('es-AR',{month:'long',year:'numeric'});const selected=data.events.filter(e=>e.starts_at&&localISO(new Date(e.starts_at))===selectedDate);return `<div class="card"><div class="calendar-head"><button class="btn secondary" onclick="shiftMonth(-1)">‹</button><b style="text-transform:capitalize">${esc(monthName)}</b><button class="btn secondary" onclick="shiftMonth(1)">›</button></div><div class="days">${cells}</div><div class="section-head"><h3>${selectedDate?`Planes del ${fmtDate(selectedDate)}`:'Elegí una fecha'}</h3><button class="btn ghost" onclick="createEventForSelected()">＋</button></div>${selected.length?selected.map(eventCard).join(''):'<p class="subtle">No hay eventos para esta fecha.</p>'}</div>`}
function selectDate(d){selectedDate=d;calendarMonth=d.slice(0,7);render()}
function shiftMonth(n){const [y,m]=calendarMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);calendarMonth=localISO(d).slice(0,7);render()}
function createEventForSelected(){go('Crear evento')}
function createEvent(){
  const emojis = [
    ['📅', 'General'],
    ['⚽', 'Fútbol'],
    ['🍕', 'Comida'],
    ['🎂', 'Cumpleaños'],
    ['🍻', 'Barcito'],
    ['🏠', 'Juntada'],
    ['🎮', 'Juegos'],
    ['🎉', 'Fiesta']
  ];

  return `<button class="back" onclick="go('Calendario')">← Volver</button>

    <div class="formrow">
      <label for="etitle">Nombre del plan</label>
      <input class="field" id="etitle" maxlength="140" required placeholder="Ej.: Fútbol 5">
    </div>

    <div class="formrow">

      <label for="edate">Fecha y hora</label>
      <input class="field" id="edate" type="datetime-local"
        value="${esc((selectedDate||localISO(new Date()))+'T19:00')}" required>
    </div>

    <div class="formrow">
      <label for="emeta">Detalles (lugar, horario, etc.)</label>
      <textarea class="field" id="emeta" maxlength="1000"

    </div>

    <button class="btn full">Guardar evento</button>

async function saveEvent(e) {
  e.preventDefault();

  const emoji = document.querySelector(
    'input[name="eventEmoji"]:checked'
  )?.value || '📅';

  const title = $('etitle').value.trim();
  const starts_at = new Date($('edate').value).toISOString();

  try {
    const { error } = await db.from('calendar_events').insert({
      title: `${emoji} ${title}`,
      description: $('emeta').value.trim() || null,
      starts_at,
      created_by: session.user.id
    });

    if (error) throw error;

    selectedDate = localISO(new Date(starts_at));
    calendarMonth = selectedDate.slice(0, 7);

    toast('¡Evento guardado en el calendario compartido!');
    await refresh();
    page = 'Calendario';
    await render();
  } catch (e) {
    showError(e);
  }
}

function createLink(){return `<button class="back" onclick="go('Enlaces')">← Volver</button>${heading('Recurso compartido','Agregar enlace','Usá una dirección web completa que empiece con https://.')}<form onsubmit="saveLink(event)" class="card"><div class="formrow"><label for="ltitle">Nombre del enlace</label><input class="field" id="ltitle" required maxlength="140" placeholder="Ej.: Fixture de fútbol"></div><div class="formrow"><label for="lurl">URL</label><input class="field" id="lurl" type="url" required placeholder="https://…"></div><button class="btn full">Guardar enlace</button></form>`}

async function removeItem(table,id){if(!confirm('¿Seguro que querés eliminar este contenido? Esta acción no se puede deshacer.'))return;try{const {data:gone,error}=await db.from(table).delete().eq('id',id).select('id');if(error)throw error;if(!gone?.length)return toast('No se pudo eliminar: solo podés borrar lo que creaste vos.');toast('Contenido eliminado.');await refresh()}catch(e){showError(e)}}

// ---------- Ruleta ----------
const WHEEL_COLORS=['#9b6dff','#5ce1e6','#ff6f91','#ffc861','#6ee7a8','#7b8cff','#ff9f6e','#d77bff'];
const wheel={loaded:false,loading:false,members:[],custom:[],off:new Set(),spins:[],spinning:false,rotation:0,winner:null};
try{wheel.custom=JSON.parse(localStorage.getItem('bdj-wheel-custom')||'[]')}catch(e){}
function saveWheelCustom(){try{localStorage.setItem('bdj-wheel-custom',JSON.stringify(wheel.custom))}catch(e){}}
function wheelEntries(){return [...wheel.members.map(m=>({key:'m:'+m.id,label:m.full_name||'Integrante',pic:m.avatar_url})),...wheel.custom.map(c=>({key:'c:'+c,label:c,pic:null}))]}
function wheelActive(){return wheelEntries().filter(e=>!wheel.off.has(e.key))}
async function loadWheel(){if(wheel.loading)return;wheel.loading=true;try{const [m,s]=await Promise.all([db.rpc('get_members'),db.from('wheel_spins').select('*').order('created_at',{ascending:false}).limit(20)]);if(m.error)throw m.error;if(s.error)throw s.error;wheel.members=m.data||[];wheel.spins=s.data||[];wheel.error=null}catch(e){console.error(e);wheel.error=e}wheel.loading=false;wheel.loaded=true;if(page==='Ruleta')await render()}
function wheelSvg(entries){const n=entries.length;if(n<2)return `<div class="wheel-empty">Elegí al menos 2 participantes para girar.</div>`;const seg=360/n,r=150,c=160;const pt=a=>{const t=(a-90)*Math.PI/180;return `${(c+r*Math.cos(t)).toFixed(2)} ${(c+r*Math.sin(t)).toFixed(2)}`};const fs=n>20?9:n>12?11:13;const max=n>20?10:14;return `<svg viewBox="0 0 320 320" class="wheel-svg"><g id="wheelSpin" style="transform:rotate(${wheel.rotation}deg)">${entries.map((e,i)=>{const a0=i*seg,a1=(i+1)*seg,mid=a0+seg/2;const L=WHEEL_COLORS.length,color=WHEEL_COLORS[i===n-1&&n%L===1?1:i%L];const label=e.label.length>max?e.label.slice(0,max-1)+'…':e.label;return `<path d="M${c} ${c} L${pt(a0)} A${r} ${r} 0 ${seg>180?1:0} 1 ${pt(a1)} Z" fill="${color}" stroke="#0d0d15" stroke-width="2"/><text x="${c+r-12}" y="${c}" dy="0.35em" transform="rotate(${mid-90} ${c} ${c})" text-anchor="end" font-size="${fs}" font-weight="700" fill="#14111f">${esc(label)}</text>`}).join('')}</g><circle cx="${c}" cy="${c}" r="22" fill="#151522" stroke="#302d45" stroke-width="3"/><text x="${c}" y="${c+6}" text-anchor="middle" font-size="18">🤘</text></svg>`}
function wheelPage(){if(!wheel.loaded){loadWheel();return `${heading('Herramientas','Ruleta')}<div class="empty">Cargando integrantes…</div>`}const entries=wheelEntries(),active=wheelActive();const w=wheel.winner;return `<button class="back" onclick="go('Herramientas')">← Herramientas</button>${heading('Sorteo','Ruleta 🎡','Elegí quiénes participan, sumá nombres u opciones y girá. El resultado queda guardado para toda la banda.')}${wheel.error?`<div class="notice">No se pudo cargar la ruleta. Revisá que el SQL <code>supabase/ruleta.sql</code> esté ejecutado en Supabase.<br><small>Detalle: ${esc(wheel.error.message||wheel.error)}</small><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="wheel.loaded=false;render()">Reintentar</button></div></div>`:''}<div class="card wheel-card"><div class="wheel-wrap"><div class="wheel-pointer">▼</div>${wheelSvg(active)}</div><div id="wheelResult" class="wheel-result ${w?'':'hide'}">${w?`🎉 <b>${esc(w)}</b>`:''}</div><button class="btn full" id="spinBtn" onclick="spinWheel()" ${wheel.spinning||active.length<2?'disabled':''}>${wheel.spinning?'Girando…':'¡Girar!'}</button></div><h2>Participantes <span class="subtle">(${active.length} de ${entries.length})</span></h2><div class="row" style="margin-bottom:10px"><button class="btn secondary" onclick="wheelAll(true)">Marcar todos</button><button class="btn secondary" onclick="wheelAll(false)">Desmarcar todos</button></div><div class="options">${entries.map(e=>`<label class="option"><input type="checkbox" ${wheel.off.has(e.key)?'':'checked'} onchange="wheelToggle(${esc(JSON.stringify(e.key))},this.checked)" ${wheel.spinning?'disabled':''}>${e.pic?`<img class="avatar" style="width:26px;height:26px" src="${esc(e.pic)}" alt="">`:`<span>${e.key.startsWith('c:')?'✏️':'👤'}</span>`}<span style="flex:1">${esc(e.label)}</span>${e.key.startsWith('c:')?`<button type="button" class="pillbtn" onclick="wheelRemove(${esc(JSON.stringify(e.label))})" ${wheel.spinning?'disabled':''}>Quitar</button>`:''}</label>`).join('')}</div><form class="row" style="margin-top:12px" onsubmit="wheelAdd(event)"><input class="field" id="wheelNew" maxlength="40" placeholder="Agregar nombre u opción (ej.: Pizza)" style="flex:1;min-width:0"><button class="btn">＋ Agregar</button></form><p class="subtle">Los nombres agregados a mano quedan guardados solo en este dispositivo.</p><h2 style="margin-top:22px">Historial</h2>${wheel.spins.length?wheel.spins.map(s=>`<div class="card" style="padding:12px 14px"><div class="card-top"><span>🎉 <b>${esc(s.winner)}</b></span><small>${new Date(s.created_at).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div><small>Girada por ${esc(s.spinner_name||'un integrante')} · entre ${(s.entries||[]).length} opciones</small></div>`).join(''):empty('🎡','Todavía no se giró la ruleta','Cuando alguien la gire, el resultado va a aparecer acá.')}`}
async function wheelToggle(key,on){if(on)wheel.off.delete(key);else wheel.off.add(key);wheel.winner=null;await render()}
async function wheelAll(on){if(on)wheel.off.clear();else wheelEntries().forEach(e=>wheel.off.add(e.key));wheel.winner=null;await render()}
async function wheelAdd(e){e.preventDefault();const v=$('wheelNew').value.trim();if(!v)return;if(wheelEntries().some(x=>x.label.toLowerCase()===v.toLowerCase()))return toast('Ese nombre ya está en la ruleta.');wheel.custom.push(v);saveWheelCustom();wheel.winner=null;await render();$('wheelNew')?.focus()}
async function wheelRemove(label){wheel.custom=wheel.custom.filter(c=>c!==label);wheel.off.delete('c:'+label);saveWheelCustom();wheel.winner=null;await render()}
async function spinWheel(){const active=wheelActive();if(wheel.spinning||active.length<2)return;const labels=active.map(e=>e.label);wheel.spinning=true;wheel.winner=null;await render();try{
 // El ganador lo elige la base de datos, así nadie puede elegirlo a mano.
 const {data:row,error}=await db.rpc('spin_wheel',{p_entries:labels});if(error)throw error;const spin=Array.isArray(row)?row[0]:row;
 const idx=Math.max(0,(spin.entries||labels).indexOf(spin.winner)),seg=360/labels.length,jitter=(Math.random()-.5)*seg*.6;
 const target=360-(idx+.5)*seg+jitter;const base=wheel.rotation-(((wheel.rotation%360)+360)%360);wheel.rotation=base+360*6+target;
 const g=$('wheelSpin');if(g){g.style.transition='transform 4.5s cubic-bezier(.17,.67,.12,1)';requestAnimationFrame(()=>{g.style.transform=`rotate(${wheel.rotation}deg)`})}
 await new Promise(r=>setTimeout(r,4700));wheel.spins=[spin,...wheel.spins].slice(0,20);wheel.winner=spin.winner;toast(`🎉 ¡Salió ${spin.winner}!`)
}catch(e){showError(e)}wheel.spinning=false;await render()}
function menuPage(){return `${heading('Configuración','Cuenta y acceso','Información de tu sesión en Banda del Jagger.')}<div class="card">${profileLine()}<div class="notice">Tu cuenta de Google identifica tus publicaciones y evita votos duplicados. La app no necesita acceso a tu correo ni a tus archivos.</div>${isAdmin?'<p class="admin-label">Tenés permisos de administrador.</p>':''}<button class="btn secondary full" style="margin-top:14px" onclick="signOut()">Cerrar sesión</button></div>`}
function profileLine(){const u=session.user;return `<div class="profileline">${u.user_metadata?.avatar_url?`<img class="avatar" src="${esc(u.user_metadata.avatar_url)}" alt="">`:'<div class="avatar" style="display:grid;place-items:center">👤</div>'}<div><b>${esc(u.user_metadata?.full_name||u.email||'Integrante')}</b><div class="subtle">${esc(u.email||'Cuenta de Google')}</div></div></div>`}
function loginPage(){return `<div class="loginbox"><section class="hero"><div class="eyebrow">Tu grupo, más organizado</div><h1>Banda del Jagger 🤘</h1><p>Votaciones, propuestas, calendario y enlaces en un solo lugar. Iniciá sesión con Google para participar.</p><button class="gbtn" onclick="signIn()">🌐 Continuar con Google</button></section><div class="notice">El acceso está limitado a personas que inicien sesión. No compartas claves privadas ni tokens. Si aparece un error, revisá la configuración de Google OAuth y las URL permitidas de Supabase.</div></div>`}
async function render(){if(!CONFIGURED){$('main').innerHTML=`${heading('Configuración pendiente','Conectemos Supabase','El sitio ya tiene el diseño y la estructura. Falta pegar la publishable key pública del proyecto para habilitar el inicio de sesión y la base de datos.')}<div class="card"><h3>Un paso antes de publicar</h3><ol><li>Abrí el archivo <b>index.html</b> con un editor.</li><li>Buscá <code>PEGAR_AQUI_TU_PUBLISHABLE_KEY</code>.</li><li>Reemplazá solamente ese texto por la publishable key de Supabase (la pública, no una secret key).</li><li>Guardá el archivo y subilo a GitHub.</li></ol><div class="notice">Nunca pegues aquí ni en el archivo una clave <code>service_role</code> o una secret key.</div></div>`;return}if(!session){$('main').innerHTML=loginPage();return}
 let view='';try{switch(page){case'Inicio':view=home();break;case'Votaciones':view=pollsPage();break;case'Crear votación':view=createPoll();break;case'Detalle':view=pollDetail();break;case'Herramientas':view=toolsPage();break;case'Ruleta':view=wheelPage();break;case'Propuestas':view=proposalsPage();break;case'Nueva propuesta':view=createIdea();break;case'Calendario':view=eventsPage();break;case'Crear evento':view=createEvent();break;case'Enlaces':view=linksPage();break;case'Nuevo enlace':view=createLink();break;case'Menú':view=menuPage();break;default:page='Inicio';view=home()}}catch(e){console.error(e);view=`<div class="empty">No se pudo mostrar esta sección. ${esc(e.message)}</div>`}$('main').innerHTML=view;nav()}
async function init(){if(!CONFIGURED){userArea();nav();await render();return}if(!window.supabase){$('main').innerHTML=empty('⚠️','No se pudo cargar Supabase','Revisá tu conexión a internet e intentá de nuevo.');return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:res,error}=await db.auth.getSession();if(error)console.warn(error);session=res?.session||null;await refresh();db.auth.onAuthStateChange((_event,newSession)=>{session=newSession;setTimeout(()=>refresh(),0)})}
nav();init();
</script>
</body>
</html>
