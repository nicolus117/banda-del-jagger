<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18"><title>Banda del Jagger</title>
<style>
:root{--bg:#080d18;--panel:#111b2c;--panel2:#17243a;--line:#263650;--text:#f4f7ff;--muted:#9eacc5;--purple:#7653ff;--purple2:#a18aff;--cyan:#63c8ff;--green:#43d9a3;--yellow:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#15213a 0,#080d18 55%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:88px}.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:15px 18px;background:#080d18ed;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#8b65ff,#5632e7);display:grid;place-items:center;font-size:22px;box-shadow:0 5px 22px #6746ff44}.brand{flex:1}.brand b{display:block;font-size:16px}.brand small{color:var(--muted)}.menu{background:transparent;color:white;border:0;font-size:24px}.content{padding:18px}.hero{padding:24px 20px;border:1px solid #33405c;border-radius:22px;background:linear-gradient(125deg,#1c2943,#121a2c 68%,#211a47);overflow:hidden;position:relative}.hero:after{content:'✦';position:absolute;right:20px;top:5px;font-size:100px;color:#8e75ff1c}.eyebrow{font-size:11px;letter-spacing:1.3px;color:var(--purple2);font-weight:800;text-transform:uppercase}.hero h1{font-size:29px;line-height:1.1;margin:9px 0}.hero p{max-width:450px;color:#c3cde0;margin:10px 0 0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}.section-head h2{font-size:18px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile,.card{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:17px;padding:15px}.tile{min-height:112px;text-align:left;color:var(--text);transition:.15s}.tile:active{transform:scale(.98)}.tile .ico{font-size:24px;display:block;margin-bottom:9px}.tile b{display:block}.tile small{color:var(--muted)}.card{margin-bottom:12px}.cardtop{display:flex;gap:12px;align-items:flex-start}.emoji{width:44px;height:44px;flex-shrink:0;display:grid;place-items:center;border-radius:13px;background:#293557;font-size:23px}.card h3{font-size:16px;margin:0 0 4px}.card p{color:var(--muted);font-size:13px;margin:0}.spacer{flex:1}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:100px;background:#30275d;color:#d8ceff;font-size:11px;font-weight:700}.btn{border:0;border-radius:13px;background:linear-gradient(100deg,var(--purple),#6243ec);color:#fff;padding:12px 16px;font-weight:750;box-shadow:0 5px 18px #6d4aff26}.btn.secondary{background:#202d44;box-shadow:none;border:1px solid #34435e}.btn.full{width:100%;margin-top:12px}.row{display:flex;gap:9px;align-items:center}.poll-option{display:flex;align-items:center;gap:9px;margin-top:9px;padding:12px;border-radius:12px;background:#0c1423;border:1px solid #273751;color:var(--text);width:100%;text-align:left}.poll-option.selected{border-color:var(--purple2);background:#28204a}.poll-option input{accent-color:var(--purple)}.bar{height:6px;background:#26344b;border-radius:20px;overflow:hidden;margin-top:8px}.bar span{height:100%;display:block;background:linear-gradient(90deg,var(--purple),#b19cff);border-radius:20px}.formrow{margin:12px 0}.formrow label{display:block;font-size:13px;color:#d8e0f0;margin-bottom:6px}.field{width:100%;background:#0a1220;color:white;border:1px solid #34435e;border-radius:12px;padding:12px;outline:none}.field:focus{border-color:var(--purple2)}textarea.field{min-height:88px;resize:vertical}.bottom{position:fixed;z-index:4;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#0a101dee;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.nav{background:none;border:0;color:#8f9db8;font-size:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px}.nav span{font-size:20px}.nav.active{color:#b7a2ff;font-weight:800}.empty{text-align:center;padding:24px;color:var(--muted)}.monthgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:5px 0}.daycell{min-height:57px;border:1px solid var(--line);border-radius:10px;background:#0d1626;color:var(--text);padding:5px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}.daycell.selected{border-color:var(--purple2);background:#30245b}.daycell.today{box-shadow:inset 0 0 0 1px var(--cyan)}.daynum{font-size:13px}.eventdot{width:6px;height:6px;border-radius:50%;background:var(--purple2);display:inline-block}.daydots{display:flex;gap:3px;min-height:7px}.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}.monthnav button{border:1px solid var(--line);border-radius:10px;background:#202d44;color:white;padding:8px 12px}.eventdate{border-radius:12px;background:#202c43;text-align:center;padding:8px;min-width:54px}.eventdate b{display:block;font-size:21px}.eventdate small{font-size:10px;color:var(--cyan);font-weight:800}.linkrow{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}.notice{background:#18223a;border:1px solid #34435e;border-radius:12px;padding:11px;color:#bac7df;font-size:12px;margin:14px 0}.hide{display:none!important}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#eef2ff;color:#111827;border-radius:12px;padding:11px 16px;z-index:10;box-shadow:0 8px 30px #0008;max-width:90%;font-weight:650;font-size:13px}.back{background:none;border:0;color:var(--purple2);font-weight:700;padding:0 0 12px}
@media(min-width:620px){.content{padding:24px}.hero{padding:30px}.hero h1{font-size:36px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{min-height:140px}}
</style></head>
<body><div class="app"><header class="top"><div class="logo">♛</div><div class="brand"><b>Banda del Jagger</b><small>El centro de operaciones</small></div><button class="menu" onclick="showMenu()" aria-label="Abrir menú">☰</button></header><main id="main" class="content"></main><nav class="bottom" id="bottom"></nav></div><div id="toast" class="toast hide"></div>
<script>
const state={page:'Inicio',polls:[{id:1,title:'¿Qué hacemos este finde?',desc:'Elegí el plan que más te guste.',options:['Fútbol 5','Pizza y birra','Asado en el parque'],votes:[6,4,2],mode:'simple',privacy:'public',end:'En 2 días',myVote:[]},{id:2,title:'¿Qué día jugamos?',desc:'Marcá todos los días que te sirven.',options:['Viernes','Sábado','Domingo'],votes:[5,8,6],mode:'multiple',privacy:'anonymous',end:'En 4 días',myVote:[]}],ideas:[{title:'Escapada de finde',desc:'Buscar un lugar para salir de la rutina.',by:'Mati',votes:8,comments:3,emoji:'🏕️'},{title:'Asado en el parque',desc:'Organizar algo al aire libre.',by:'Agus',votes:6,comments:1,emoji:'🍖'}],events:[{id:1,date:'2026-10-17',title:'Fútbol 5',meta:'19:00 · La Plaza',emoji:'⚽',by:'Mati',people:6},{id:2,date:'2026-10-24',title:'Cumple de Agus',meta:'21:00 · El Patio',emoji:'🎂',by:'Agus',people:5}],links:[{title:'Foro de viajes',url:'https://www.reddit.com/',desc:'Ideas, rutas y recomendaciones',emoji:'🌐'},{title:'Fixture de fútbol',url:'https://www.afa.com.ar/',desc:'Calendario y resultados',emoji:'⚽'},{title:'YouTube',url:'https://www.youtube.com/',desc:'Videos y playlists',emoji:'▶️'}],currentPoll:null,menu:false,calendarMonth:'2026-10',selectedDate:'2026-10-17',adminMode:false};
const navs=[['Inicio','⌂'],['Votaciones','☑'],['Propuestas','♧'],['Calendario','▦'],['Enlaces','↗']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),2300)}
function go(p){state.page=p;state.menu=false;render()}
function nav(){document.getElementById('bottom').innerHTML=navs.map(([n,i])=>`<button class="nav ${state.page===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n}</button>`).join('')}
function render(){nav();let m=document.getElementById('main');if(state.page==='Inicio')m.innerHTML=home();else if(state.page==='Votaciones')m.innerHTML=polls();else if(state.page==='Propuestas')m.innerHTML=ideas();else if(state.page==='Calendario')m.innerHTML=events();else if(state.page==='Enlaces')m.innerHTML=links();else if(state.page==='Crear votación')m.innerHTML=createPoll();else if(state.page==='Nueva propuesta')m.innerHTML=createIdea();else if(state.page==='Crear evento')m.innerHTML=createEvent();else if(state.page==='Detalle')m.innerHTML=pollDetail(state.currentPoll);else if(state.page==='Menú')m.innerHTML=menuPage();}
function home(){return `<section class="hero"><div class="eyebrow">EL GRUPO, EN UN SOLO LUGAR</div><h1>Buenas, banda 🤘</h1><p>Acá organizamos planes, votamos, compartimos ideas y mucho más.</p></section><div class="section-head"><h2>Próxima votación</h2><span class="pill">ABIERTA</span></div><div class="card"><div class="cardtop"><div class="emoji">🌅</div><div><h3>${esc(state.polls[0]?.title||'Creá la próxima votación')}</h3><p>${state.polls[0]?.options.length||0} opciones · Cierra ${state.polls[0]?.end||'cuando quieras'}</p></div></div><button class="btn full" onclick="openPoll(${state.polls[0]?.id||0})">Ver votación →</button></div><div class="section-head"><h2>Accesos rápidos</h2></div><div class="grid">${[['Votaciones','☑','Decidamos juntos'],['Calendario','▦','Fechas y planes'],['Propuestas','💡','Ideas del grupo'],['Enlaces','↗','Sitios compartidos']].map(([n,i,d])=>`<button class="tile" onclick="go('${n}')"><span class="ico">${i}</span><b>${n}</b><small>${d}</small></button>`).join('')}</div><div class="section-head"><h2>Próximos planes</h2><button class="btn secondary" onclick="go('Calendario')">Ver todos</button></div>${state.events.slice(0,2).map(eventCard).join('')}`}
function polls(){return `<div class="eyebrow">TU OPINIÓN CUENTA</div><div class="section-head"><h2>Votaciones</h2><span class="pill">${state.polls.length} activas</span></div><p class="muted">Encuestas, rankings y decisiones de la banda.</p>${state.polls.map(p=>`<div class="card"><div class="cardtop"><div class="emoji">🗳️</div><div style="flex:1"><h3>${esc(p.title)}</h3><p>${p.options.length} opciones · Cierra ${esc(p.end)}</p><div class="row" style="margin-top:8px"><span class="pill">${p.mode==='ranking'?'Ranking':p.mode==='multiple'?'Selección múltiple':'Voto simple'}</span><span class="muted small">${p.privacy==='anonymous'?'🔒 Anónima':'👥 Pública'}</span></div></div></div><button class="btn full" onclick="openPoll(${p.id})">${p.myVote.length?'Ver / cambiar voto':'Votar ahora'}</button></div>`).join('')}<button class="btn full" onclick="go('Crear votación')">＋ Crear nueva votación</button>`}
function pollDetail(id){let p=state.polls.find(x=>x.id===id);if(!p)return `<button class="back" onclick="go('Votaciones')">← Volver</button><div class="empty">Todavía no hay votaciones. ¡Creá una!</div>`;let total=p.votes.reduce((a,b)=>a+b,0);return `<button class="back" onclick="go('Votaciones')">← Todas las votaciones</button><div class="eyebrow">VOTACIÓN ABIERTA</div><h1 style="font-size:27px;margin:8px 0">${esc(p.title)}</h1><p class="muted">${esc(p.desc)}</p><div class="notice">${p.privacy==='anonymous'?'🔒 Voto anónimo: no se muestra quién eligió qué.':'👥 Voto público: las elecciones pueden ser visibles para el grupo.'} ${p.mode==='multiple'?'Podés elegir más de una opción.':p.mode==='ranking'?'Ordená tus preferencias con los números.':'Elegí una opción.'}</div><div id="choices">${p.options.map((o,i)=>{let selected=p.myVote.includes(i);return `<label class="poll-option ${selected?'selected':''}">${p.mode==='multiple'?`<input type="checkbox" value="${i}" ${selected?'checked':''}>`:p.mode==='ranking'?`<input type="number" min="1" max="${p.options.length}" value="${selected?p.myVote.indexOf(i)+1:''}" placeholder="—" style="width:45px;background:#111b2c;color:white;border:1px solid #3b4b67;border-radius:8px;padding:5px">`:`<input type="radio" name="vote" value="${i}" ${selected?'checked':''}>`}<span style="flex:1">${esc(o)}</span></label><div class="bar"><span style="width:${total?Math.round(p.votes[i]/total*100):0}%"></span></div><p class="muted small" style="margin:3px 0 8px">${p.votes[i]} votos · ${total?Math.round(p.votes[i]/total*100):0}%</p>`}).join('')}</div><button class="btn full" onclick="submitVote(${p.id})">Guardar mi voto</button><p class="muted small" style="text-align:center">Demo: los votos de este prototipo no se comparten entre dispositivos.</p>`}
function ideas(){return `<div class="eyebrow">TIRÁ TU IDEA</div><div class="section-head"><h2>Propuestas</h2><span class="pill">${state.ideas.length} ideas</span></div><p class="muted">Cualquier idea suma. Después la banda decide.</p>${state.ideas.map((i,n)=>`<div class="card"><div class="cardtop"><div class="emoji">${i.emoji}</div><div style="flex:1"><h3>${esc(i.title)}</h3><p>${esc(i.desc)}</p><p style="margin-top:8px">Por ${esc(i.by)} · 👍 ${i.votes} · 💬 ${i.comments}</p></div></div><button class="btn secondary full" onclick="likeIdea(${n})">👍 Me copa</button></div>`).join('')}<button class="btn full" onclick="go('Nueva propuesta')">＋ Nueva propuesta</button>`}
function eventCard(e){let d=e.date?new Date(e.date+'T12:00:00'):null;let day=d?String(d.getDate()).padStart(2,'0'):(e.day||'');let month=d?['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][d.getMonth()]:(e.month||'');return `<div class="card"><div class="cardtop"><div class="eventdate"><small>${esc(month)}</small><b>${esc(day)}</b></div><div style="flex:1"><h3>${e.emoji||'📅'} ${esc(e.title)}</h3><p>${esc(e.meta||'Horario y lugar a confirmar')}</p><p style="margin-top:6px">Propuesto por ${esc(e.by||'Integrante')} · 👥 ${e.people||0} interesados</p></div>${state.adminMode?`<button class="btn secondary" onclick="deleteEvent(${e.id})" aria-label="Eliminar evento">🗑️</button>`:''}</div></div>`}
function events(){let [yy,mm]=state.calendarMonth.split('-').map(Number);let first=new Date(yy,mm-1,1);let days=new Date(yy,mm,0).getDate();let offset=(first.getDay()+6)%7;let monthName=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][mm-1];let cells='';for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let date=`${yy}-${String(mm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;let count=state.events.filter(e=>e.date===date).length;cells+=`<button class="daycell ${state.selectedDate===date?'selected':''}" onclick="selectCalendarDate('${date}')"><span class="daynum">${d}</span><span class="daydots">${count?'<i class="eventdot"></i>'.repeat(Math.min(count,3)):''}</span></button>`}let chosen=state.events.filter(e=>e.date===state.selectedDate).sort((a,b)=>a.title.localeCompare(b.title));return `<div class="eyebrow">LOS PLANES DE LA BANDA, EN UN SOLO LUGAR</div><div class="section-head"><h2>Calendario grupal</h2><span class="pill">${state.events.length} eventos</span></div><p class="muted">Todos pueden sumar eventos. Solo el administrador puede eliminarlos.</p><div class="card"><div class="monthnav"><button onclick="shiftMonth(-1)" aria-label="Mes anterior">‹</button><h3>${monthName} ${yy}</h3><button onclick="shiftMonth(1)" aria-label="Mes siguiente">›</button></div><div class="monthgrid" style="margin-top:12px">${['L','M','X','J','V','S','D'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div><div class="row" style="margin-top:12px"><span class="eventdot"></span><span class="muted small">Día con eventos</span><span class="spacer"></span><button class="btn secondary" onclick="go('Crear evento')">＋ Agregar evento</button></div></div><div class="section-head"><h2>${state.selectedDate?new Date(state.selectedDate+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}):'Eventos del día'}</h2></div>${chosen.length?chosen.map(eventCard).join(''):'<div class="card empty">No hay eventos para este día. ¡Podés agregar uno!</div>'}<div class="notice">Prototipo: los cambios se guardan solo durante esta sesión y no se comparten todavía entre dispositivos. El permiso de administrador es una simulación visual; lo protegeremos en el servidor al publicar la web.</div><button class="btn secondary full" onclick="toggleAdminDemo()">${state.adminMode?'Salir del modo administrador':'Simular modo administrador'}</button>`}
function selectCalendarDate(date){state.selectedDate=date;state.calendarMonth=date.slice(0,7);render()}
function shiftMonth(delta){let [y,m]=state.calendarMonth.split('-').map(Number);let d=new Date(y,m-1+delta,1);state.calendarMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;state.selectedDate=`${state.calendarMonth}-01`;render()}
function toggleAdminDemo(){state.adminMode=!state.adminMode;toast(state.adminMode?'Modo administrador de demostración activado':'Modo administrador desactivado');render()}
function deleteEvent(id){if(!state.adminMode){toast('Solo el administrador puede eliminar eventos.');return}if(!confirm('¿Eliminar este evento de la demostración?'))return;state.events=state.events.filter(e=>e.id!==id);toast('Evento eliminado en esta demo');render()}
function links(){return `<div class="eyebrow">TODO LO ÚTIL, A MANO</div><div class="section-head"><h2>Enlaces</h2></div><p class="muted">Foros, videos, fixtures y páginas que comparte la banda.</p>${state.links.map(l=>`<a class="card linkrow" href="${esc(l.url)}" target="_blank" rel="noopener"><div class="emoji">${l.emoji}</div><div style="flex:1"><h3>${esc(l.title)}</h3><p>${esc(l.desc)}</p><p class="small" style="margin-top:4px">${esc(l.url)}</p></div><span>↗</span></a>`).join('')}<button class="btn full" onclick="addLink()">＋ Agregar enlace</button>`}
function createPoll(){return `<button class="back" onclick="go('Votaciones')">← Volver</button><h1 style="font-size:26px">Crear votación</h1><p class="muted">Armá una encuesta para que decida la banda.</p><form onsubmit="savePoll(event)"><div class="formrow"><label>Pregunta</label><input class="field" id="ptitle" required placeholder="Ej.: ¿Qué hacemos el sábado?"></div><div class="formrow"><label>Opciones (una por línea)</label><textarea class="field" id="poptions" required placeholder="Fútbol 5&#10;Pizza y birra&#10;Asado"></textarea></div><div class="formrow"><label>Tipo de votación</label><select class="field" id="pmode"><option value="simple">Una opción por persona</option><option value="multiple">Elegir varias opciones</option><option value="ranking">Ordenar por preferencia (demo)</option></select></div><div class="formrow"><label>Privacidad</label><select class="field" id="pprivacy"><option value="public">Voto público</option><option value="anonymous">Voto anónimo</option></select></div><div class="formrow"><label>Cierre</label><select class="field" id="pend"><option>En 1 día</option><option selected>En 3 días</option><option>En 7 días</option><option>Sin fecha definida</option></select></div><button class="btn full">Crear votación</button></form><div class="notice">Todos podrán crear propuestas y eventos. En la versión publicada, solo tu cuenta de administrador tendrá permiso para eliminar contenido. Esta maqueta no aplica todavía permisos reales.</div>`}
function createIdea(){return `<button class="back" onclick="go('Propuestas')">← Volver</button><h1 style="font-size:26px">Nueva propuesta</h1><form onsubmit="saveIdea(event)"><div class="formrow"><label>¿Qué proponés?</label><input class="field" id="ititle" required placeholder="Ej.: Escapada a la costa"></div><div class="formrow"><label>Contanos un poco más</label><textarea class="field" id="idesc" placeholder="Fecha, lugar, idea general..."></textarea></div><div class="formrow"><label>Tu apodo</label><input class="field" id="iby" placeholder="Ej.: Nico"></div><button class="btn full">Publicar propuesta</button></form>`}
function createEvent(){return `<button class="back" onclick="go('Calendario')">← Volver</button><h1 style="font-size:26px">Agregar evento</h1><p class="muted">Compartilo con toda la banda.</p><form onsubmit="saveEvent(event)"><div class="formrow"><label>Nombre del plan</label><input class="field" id="etitle" required maxlength="100" placeholder="Ej.: Fútbol 5"></div><div class="formrow"><label>Fecha</label><input class="field" id="edate" type="date" value="${state.selectedDate||state.calendarMonth+'-01'}" required></div><div class="formrow"><label>Hora y lugar</label><input class="field" id="emeta" maxlength="140" placeholder="Ej.: 19:00 · La Plaza"></div><div class="formrow"><label>Quién lo propone</label><input class="field" id="eby" required placeholder="Tu nombre o apodo"></div><button class="btn full">Guardar evento</button></form><div class="notice">En esta demo, el evento se guarda solo en esta sesión. En la web publicada lo guardaremos en una base de datos compartida.</div>`}
function menuPage(){return `<h1>Menú</h1>${navs.map(([n,i])=>`<button class="poll-option" onclick="go('${n}')"><span>${i}</span>${n}</button>`).join('')}<div class="notice">Banda del Jagger · Juntos siempre es mejor 🤘</div>`}
function openPoll(id){state.currentPoll=id;go('Detalle')}
function submitVote(id){let p=state.polls.find(x=>x.id===id);if(!p)return;let selected=[];if(p.mode==='multiple')selected=[...document.querySelectorAll('#choices input[type=checkbox]:checked')].map(x=>+x.value);else if(p.mode==='ranking')selected=[...document.querySelectorAll('#choices input[type=number]')].filter(x=>x.value).sort((a,b)=>+a.value-+b.value).map(x=>+x.closest('label').querySelector('input[type=number]').value).map((_,idx)=>idx);else{let r=document.querySelector('#choices input[type=radio]:checked');if(r)selected=[+r.value]}if(!selected.length){toast('Elegí al menos una opción.');return}if(!p.myVote.length)selected.forEach(i=>p.votes[i]++);p.myVote=selected;toast('Voto registrado en esta demo');render()}
function savePoll(e){e.preventDefault();let opts=document.getElementById('poptions').value.split('\n').map(x=>x.trim()).filter(Boolean);if(opts.length<2){toast('Agregá al menos dos opciones.');return}state.polls.unshift({id:Date.now(),title:document.getElementById('ptitle').value,desc:'Encuesta creada por la banda.',options:opts,votes:opts.map(()=>0),mode:document.getElementById('pmode').value,privacy:document.getElementById('pprivacy').value,end:document.getElementById('pend').value,myVote:[]});toast('¡Votación creada!');go('Votaciones')}
function saveIdea(e){e.preventDefault();state.ideas.unshift({title:document.getElementById('ititle').value,desc:document.getElementById('idesc').value||'Nueva idea de la banda.',by:document.getElementById('iby').value||'Un integrante',votes:0,comments:0,emoji:'💡'});toast('¡Propuesta agregada!');go('Propuestas')}
function saveEvent(e){e.preventDefault();let date=document.getElementById('edate').value;if(!date)return;state.events.push({id:Date.now(),date,title:document.getElementById('etitle').value.trim(),meta:document.getElementById('emeta').value.trim()||'Horario y lugar a confirmar',emoji:'📅',by:document.getElementById('eby').value.trim(),people:0});state.selectedDate=date;state.calendarMonth=date.slice(0,7);toast('Evento agregado a esta demo');go('Calendario')}
function likeIdea(n){state.ideas[n].votes++;toast('¡Sumaste tu apoyo!');render()}
function addCalendar(){let name=prompt('Nombre del calendario (ej.: Calendario de Agus):');if(!name)return;let url=prompt('Pegá el enlace compartido del calendario (Google Calendar u otro):');if(!url)return;if(!/^https?:\/\//i.test(url)){toast('Pegá un enlace válido que empiece con https://');return}toast('Calendario anotado en esta demo. La sincronización se configura al publicar la web.')}
function addLink(){let title=prompt('Nombre del enlace:');if(!title)return;let url=prompt('Pegá la URL completa (https://...):');if(!url)return;if(!/^https?:\/\//i.test(url)){toast('Usá una URL que empiece con https://');return}state.links.push({title,url,desc:'Enlace compartido por la banda',emoji:'🔗'});render();toast('Enlace agregado a esta demo')}
function showMenu(){go('Menú')}
render();
</script></body></html>
