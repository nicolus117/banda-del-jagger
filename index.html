<div class="app">

  </div><div class="brand"><b>Banda del Jagger</b><small>Si vas a hacerla bien, hacela bien</small></div>
  <div class="user-area" id="userArea"></div>
</header>
<main id="main" class="content"><div class="empty"><span class="spinner"></span><p style="margin:10px 0 0">Preparando la banda…</p></div></main>
<nav class="bottom" id="bottom"></nav>
</div>
<div id="toast" class="toast hide" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL = 'https://iomqmnxzcbxepkdbhomz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SwTp5a9Q2xCSJiccZRCqpg_rf8bl289';
const CONFIGURED = SUPABASE_ANON_KEY !== 'PEGAR_AQUI_TU_PUBLISHABLE_KEY' && SUPABASE_ANON_KEY.trim().length > 20;
const navs=[['Inicio','⌂'],['Votaciones','☑'],['Herramientas','🧰'],['Calendario','▦'],['Enlaces','↗']];
let db=null, session=null, profile=null, isAdmin=false, page='Inicio', currentPoll=null, selectedDate='', calendarMonth='', toastTimer=null;
let data={polls:[],options:[],votes:[],results:[],voters:{},ideas:[],events:[],links:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short'}):'';
const localISO=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
  selectedDate=localISO(new Date());calendarMonth=selectedDate.slice(0,7);

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hide'),3000)}
function friendlyError(e){const m=e?.message||String(e||'Ocurrió un error');console.error(e);if(/row-level security|permission denied/i.test(m))return 'La base de datos bloqueó esta acción por permisos. Revisá que el SQL de configuración esté aplicado.';if(/duplicate key|unique constraint/i.test(m))return 'Ya existe un registro equivalente o ya votaste en esta opción.';return m}
function showError(e){toast(friendlyError(e))}
const NAV_PARENT={'Propuestas':'Herramientas','Nueva propuesta':'Herramientas','Ruleta':'Herramientas','Amigo invisible':'Herramientas','Gastos':'Herramientas','Truco':'Herramientas','Crear votación':'Votaciones','Detalle':'Votaciones','Crear evento':'Calendario','Nuevo enlace':'Enlaces'};
function nav(){const cur=NAV_PARENT[page]||page; $('bottom').innerHTML=navs.map(([n,i])=>`<button class="navitem ${cur===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span><span>${n}</span></button>`).join('') }
function userArea(){if(!session){$('userArea').innerHTML='';return}const name=profile?.full_name||session.user.user_metadata?.full_name||session.user.email||'Integrante';const pic=profile?.avatar_url||session.user.user_metadata?.avatar_url;$('userArea').innerHTML=`${pic?`<img class="avatar" src="${esc(pic)}" alt="">`:`<div class="avatar" style="display:grid;place-items:center">👤</div>`}<span class="subtle">${esc(name.split(' ')[0])}${isAdmin?' · Admin':''}</span><button class="pillbtn" onclick="signOut()">Salir</button>`}
async function go(p){page=p;if(p==='Gastos'){exp.loaded=false;exp.current=null;exp.adding=false;exp.creating=false}if(p==='Amigo invisible')santa.loaded=false;if(p==='Ruleta')wheel.loaded=false;nav();await render()}
async function signIn(){if(!db)return toast('Primero configurá la clave pública de Supabase en el archivo.');const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});if(error)showError(error)}
async function signOut(){if(db){const {error}=await db.auth.signOut();if(error)showError(error)}}
async function loadAll(){
 const tasks=[
  ['polls','polls',true],['options','poll_options',false],
  ['ideas','proposals',true],['events','calendar_events',true],['links','shared_links',true]
 ];
 const results=await Promise.all(tasks.map(async ([key,table,hasCreatedAt])=>{let q=db.from(table).select('*');if(hasCreatedAt)q=q.order('created_at',{ascending:false});const {data,error}=await q.limit(500);if(error)throw error;return [key,data||[]]}));
 results.forEach(([k,v])=>data[k]=v);

 // Los resultados se consultan mediante una función segura que devuelve solo agregados.
 const [summaryGroups, ownResult] = await Promise.all([
  Promise.all(data.polls.map(async poll => {
   const {data: rows, error} = await db.rpc('get_vote_results', {
    p_poll_id: poll.id
   });
   if (error) throw error;
   return rows || [];
  })),
  db.from('votes')
   .select('id,poll_id,option_id,voter_id,ranking_position,created_at')
   .eq('voter_id', session.user.id)
   .limit(500)
 ]);
 if (ownResult.error) throw ownResult.error;
 data.results = summaryGroups.flat();
 data.votes = ownResult.data || [];

 // Votaciones públicas: se pide quién votó qué. La base de datos no devuelve nada para las anónimas.
 data.voters = {};
 await Promise.all(data.polls.filter(p => !p.anonymous).map(async poll => {
  const {data: rows, error} = await db.rpc('get_poll_voters', {p_poll_id: poll.id});
  if (error) { console.error('Error consultando get_poll_voters:', error); data.voters[poll.id] = null; return; }
  data.voters[poll.id] = rows || [];
 }));

}
async function refresh(){if(!session){data={polls:[],options:[],votes:[],results:[],voters:{},ideas:[],events:[],links:[]};userArea();nav();await render();return}
 try{const {data:admins,error}=await db.from('admin_users').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error)console.error('Error consultando admin_users:',error);isAdmin=!!admins;await loadAll();userArea();await render()}catch(e){showError(e);userArea();await render()}}
function heading(kicker,title,desc=''){return `<div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1>${desc?`<p class="muted">${esc(desc)}</p>`:''}`}
function empty(icon,title,desc,button=''){return `<div class="empty"><div class="big">${icon}</div><b>${esc(title)}</b><p>${esc(desc)}</p>${button}</div>`}
function canDelete(owner){return isAdmin||(!!owner&&owner===session?.user?.id)}
function delButton(table,id,owner){return canDelete(owner)?`<button class="btn danger" onclick="removeItem('${table}','${id}')">Eliminar</button>`:''}
function countVotes(pollId){return Number(data.results.find(v=>v.poll_id===pollId)?.total_voters||0)}
function voterChip(v){const name=v.voter_name||'Integrante';return `<span class="voter">${v.avatar_url?`<img src="${esc(v.avatar_url)}" alt="">`:`<i>👤</i>`}${v.ranking_position?`<b>${Number(v.ranking_position)}°</b>`:''}${esc(name)}</span>`}
function peopleLabel(n){return n===1?'1 persona votó':`${n} personas votaron`}
function pollOptions(pollId){return data.options.filter(o=>o.poll_id===pollId)}
function pollClosed(p){return !!p.closes_at&&new Date(p.closes_at)<=new Date()}
function fmtDateTime(s){return new Date(s).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function pollDeadlineTag(p){if(!p.closes_at)return '';return pollClosed(p)?'<span class="tag" style="border-color:#7a334b;color:#ffc2d0">🔒 Cerrada</span>':`<span class="tag">⏰ Cierra el ${esc(fmtDateTime(p.closes_at))}</span>`}
function pollWinner(p,opts){if(p.poll_type==='ranking')return null;const counts=opts.map(o=>({o,n:Number(data.results.find(v=>v.option_id===o.id)?.vote_count||0)}));const max=Math.max(0,...counts.map(c=>c.n));if(!max)return [];return counts.filter(c=>c.n===max).map(c=>c.o.label)}
function pollClosedBox(p,opts,my){const w=pollWinner(p,opts);return `<div class="card" style="text-align:center"><div class="tag" style="border-color:#7a334b;color:#ffc2d0">🔒 Votación cerrada el ${esc(fmtDateTime(p.closes_at))}</div>${w===null?'<p class="muted" style="margin:12px 0 0">Mirá el resultado final abajo.</p>':!w.length?'<p class="muted" style="margin:12px 0 0">Nadie votó en esta votación.</p>':`<p class="subtle" style="margin:14px 0 4px">${w.length>1?'Empate entre':'🏆 Ganó'}</p><h2 style="margin:0">${w.map(esc).join(' · ')}</h2>`}${my.length?'<p class="subtle" style="margin:12px 0 0">Tu voto quedó registrado.</p>':''}</div>`}
function pollCard(p){const opts=pollOptions(p.id),total=countVotes(p.id);return `<article class="card"><div class="card-top"><div><div class="row" style="gap:6px"><span class="tag">${p.anonymous?'🕶 Anónima':'👥 Pública'} · ${esc(p.poll_type)}</span>${pollDeadlineTag(p)}</div><h3 style="margin-top:10px">${esc(p.title)}</h3></div>${delButton('polls',p.id,p.created_by)}</div><p class="muted">${esc(p.description||'Votá y ayudá a decidir el próximo plan.')}</p><div class="row"><span class="subtle">${opts.length} opciones</span><span class="subtle">· ${peopleLabel(total)}</span></div><div class="row" style="margin-top:14px"><button class="btn" onclick="openPoll('${p.id}')">Ver votación</button></div></article>`}
function home(){const now=new Date();const limit=new Date(now);limit.setDate(limit.getDate()+15);const upcoming=[...data.events].filter(e=>{if(!e.starts_at)return false;const date=new Date(e.starts_at);return date>=now&&date<=limit}).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)).slice(0,3);
return `${heading('El grupo se organiza','¡Aloha!','Un solo lugar para decidir, proponer y organizar los próximos planes.') }<section class="hero"><div class="eyebrow">Banda del Jagger</div><h1>Los mejores planes<br>se arman entre todos.</h1><p>Votá, tirá ideas y organizá las juntadas. Todo queda guardado y compartido.</p><div class="row"><button class="btn" onclick="go('Votaciones')">Ver votaciones</button><button class="btn secondary" onclick="go('Calendario')">Abrir calendario</button></div></section><div class="tiles"><button class="tile" onclick="go('Votaciones')"><span class="ico">☑</span><b>Votaciones</b><small>${data.polls.length} activas</small></button><button class="tile" onclick="go('Propuestas')"><span class="ico">💡</span><b>Propuestas</b><small>${data.ideas.length} ideas de la banda</small></button><button class="tile" onclick="go('Calendario')"><span class="ico">▦</span><b>Calendario</b><small>${data.events.length} eventos</small></button><button class="tile" onclick="go('Enlaces')"><span class="ico">↗</span><b>Enlaces</b><small>${data.links.length} recursos compartidos</small></button></div>${installCard()}<div class="section-head"><h2>Próximos planes</h2><button class="btn secondary" onclick="go('Calendario')">Ver todos</button></div>${upcoming.length?upcoming.map(eventCard).join(''):empty('📅','Todavía no hay planes','Creá un evento para que aparezca acá.')}<div class="notice">Conectado a una base de datos compartida. Tus publicaciones quedan visibles para los integrantes que iniciaron sesión.</div>`}
function pollsPage(){return `${heading('Decisiones grupales','Votaciones','Elegí una opción, marcá varias o completá un ranking.') }<div class="row" style="margin:16px 0 20px"><button class="btn" onclick="go('Crear votación')">＋ Nueva votación</button></div>${data.polls.length?data.polls.map(pollCard).join(''):empty('☑','No hay votaciones todavía','Sé el primero en proponer una decisión.','<button class="btn" onclick="go(\'Crear votación\')">Crear votación</button>')}`}
function openPoll(id){currentPoll=id;go('Detalle')}
function pollDetail(){const p=data.polls.find(x=>x.id===currentPoll);if(!p)return `${heading('Votaciones','No se encontró la votación')}<button class="btn secondary" onclick="go('Votaciones')">Volver</button>`;const opts=pollOptions(p.id);const my=data.votes.filter(v=>v.poll_id===p.id&&v.voter_id===session.user.id);const mode=p.poll_type||'simple';const voters=p.anonymous?[]:data.voters[p.id];return `<button class="back" onclick="go('Votaciones')">← Volver a votaciones</button>${heading(p.anonymous?'Votación anónima':'Votación pública',p.title,p.description||'Tu voto ayuda a decidir.') }${pollClosed(p)?pollClosedBox(p,opts,my):`<div class="card"><div class="row" style="gap:6px"><span class="tag">${esc(mode)}</span>${pollDeadlineTag(p)}</div><div class="options" id="choices">${opts.map((o,i)=>mode==='ranking'?`<label class="option"><span style="flex:1">${esc(o.label)}</span><select class="field rank-choice" data-option="${esc(o.id)}" style="width:95px;padding:7px"><option value="">—</option>${opts.map((_,n)=>`<option value="${n+1}" ${my.find(v=>v.option_id===o.id)?.ranking_position===n+1?'selected':''}>${n+1}°</option>`).join('')}</select></label>`:`<label class="option"><input ${mode==='multiple'?'type="checkbox"':'type="radio"'} name="choice" value="${esc(o.id)}" ${my.some(v=>v.option_id===o.id)?'checked':''}><span>${esc(o.label)}</span></label>`).join('')}</div>${p.anonymous?'':'<p class="subtle">👥 Votación pública: el resto del grupo verá lo que votes.</p>'}${my.length?'<p class="subtle">Ya registraste tu voto. Si votás de nuevo, se reemplazará tu selección.</p>':''}<button class="btn full" onclick="submitVote('${p.id}','${esc(mode)}')">Guardar mi voto</button></div>`}<h2>Resultados</h2><p class="muted"><b>${peopleLabel(countVotes(p.id))}</b>${p.anonymous?' · votación anónima, no se muestra quién votó.':''}</p>${opts.map(o=>{const summary=data.results.find(v=>v.option_id===o.id);const n=Number(summary?.vote_count||0);const total=Number(summary?.total_selections||0);const pct=total?Math.round(n/total*100):0;const who=voters?voters.filter(v=>v.option_id===o.id).sort((a,b)=>(a.ranking_position||0)-(b.ranking_position||0)):[];return `<div class="card" style="padding:12px 14px"><div class="card-top"><span>${esc(o.label)}</span><b>${n}</b></div><div class="bar"><span style="width:${pct}%"></span></div><small>${pct}% de las selecciones</small>${who.length?`<div class="voters">${who.map(voterChip).join('')}</div>`:''}</div>`}).join('')}${canDelete(p.created_by)?`<div class="row">${delButton('polls',p.id,p.created_by)}</div>`:''}<div class="notice">${p.anonymous?'Votación anónima: solo se muestra cuántas personas votaron y los totales por opción. Nadie, ni siquiera los administradores desde la app, puede ver quién votó qué.':voters===null?'Votación pública, pero no se pudo cargar quién votó. Revisá que la función <code>get_poll_voters</code> esté creada en Supabase.':'Votación pública: todos los integrantes pueden ver quién votó cada opción.'}</div>`}
async function submitVote(pollId,mode){const p=data.polls.find(x=>x.id===pollId);if(!p)return;if(pollClosed(p)){toast('Esta votación ya cerró.');return render()}let selected=[],positions={};if(mode==='ranking'){const picks=[...document.querySelectorAll('#choices .rank-choice')].map(x=>({id:x.dataset.option,pos:x.value?Number(x.value):null})).filter(x=>x.pos!==null);const seen=new Set(picks.map(x=>x.pos));if(picks.length<2)return toast('Ordená al menos dos opciones.');if(seen.size!==picks.length)return toast('No repitas posiciones en el ranking.');picks.sort((a,b)=>a.pos-b.pos);selected=picks.map(x=>x.id);positions=Object.fromEntries(picks.map(x=>[x.id,x.pos]));}else{selected=[...document.querySelectorAll('#choices input:checked')].map(x=>x.value);if(mode==='simple'&&selected.length>1)selected=selected.slice(0,1)}if(!selected.length)return toast('Elegí al menos una opción.');try{const rows=selected.map(option_id=>({option_id,ranking_position:mode==='ranking'?positions[option_id]:null}));const {error}=await db.rpc('cast_vote',{p_poll_id:pollId,p_votes:rows});if(error)throw error;toast('¡Voto registrado!');await refresh()}catch(e){showError(e)}}
function createPoll(){return `<button class="back" onclick="go('Votaciones')">← Volver</button>${heading('Nueva decisión','Crear votación','La pregunta y las opciones quedarán compartidas con toda la banda.')}<form onsubmit="savePoll(event)" class="card"><div class="formrow"><label for="ptitle">Pregunta</label><input class="field" id="ptitle" maxlength="140" required placeholder="Ej.: ¿Qué hacemos este finde?"></div><div class="formrow"><label for="pdesc">Descripción (opcional)</label><textarea class="field" id="pdesc" maxlength="500" placeholder="Agregá contexto o detalles…"></textarea></div><div class="formrow"><label for="pmode">Tipo de votación</label><select class="field" id="pmode"><option value="simple">Voto simple (una opción)</option><option value="multiple">Voto múltiple (varias opciones)</option><option value="ranking">Ranking (orden de preferencia)</option></select></div><div class="formrow"><label for="poptions">Opciones (una por línea, mínimo 2)</label><textarea class="field" id="poptions" required placeholder="Fútbol 5&#10;Pizza y birra&#10;Asado en el parque"></textarea></div><div class="formrow"><label for="pprivacy">Tipo de poll</label><select class="field" id="pprivacy"><option value="true">🕶 Anónima (solo se ve cuántas personas votaron)</option><option value="false">👥 Pública (se ve quién votó cada opción)</option></select></div><div class="formrow"><label for="pcloses">Cierre de la votación (opcional)</label><input class="field" type="datetime-local" id="pcloses"><small>Si ponés fecha y hora, la votación se cierra sola y muestra la opción ganadora.</small></div><button class="btn full">Publicar votación</button></form>`}
async function savePoll(e){e.preventDefault();const title=$('ptitle').value.trim(),description=$('pdesc').value.trim(),poll_type=$('pmode').value,anonymous=$('pprivacy').value==='true';const labels=$('poptions').value.split('\n').map(s=>s.trim()).filter(Boolean);if(labels.length<2)return toast('Agregá al menos dos opciones.');if(labels.length>30)return toast('Usá como máximo 30 opciones.');const closesRaw=$('pcloses').value,closes_at=closesRaw?new Date(closesRaw):null;if(closes_at&&closes_at<=new Date())return toast('La fecha de cierre tiene que ser en el futuro.');try{const {data:created,error}=await db.rpc('create_poll',{p_title:title,p_description:description||null,p_poll_type:poll_type,p_anonymous:anonymous,p_options:labels});if(error)throw error;
 if(closes_at){
  // create_poll no recibe la fecha de cierre: se guarda aparte sobre la votación recién creada.
  let pollId=typeof created==='string'?created:(created?.id||created?.[0]?.id||null);
  if(!pollId){const {data:mine}=await db.from('polls').select('id').eq('title',title).eq('created_by',session.user.id).order('created_at',{ascending:false}).limit(1);pollId=mine?.[0]?.id}
  const {error:dErr}=pollId?await db.rpc('set_poll_deadline',{p_poll_id:pollId,p_closes_at:closes_at.toISOString()}):{error:new Error('No se encontró la votación creada.')};
  if(dErr){console.error(dErr);toast('Votación publicada, pero no se pudo guardar la fecha de cierre. Revisá que supabase/cierre_votaciones.sql esté ejecutado.')}else toast('¡Votación publicada!')
 }else toast('¡Votación publicada!');
 await refresh();page='Votaciones';await render()}catch(e){showError(e)}}

function eventCard(e) {
  const date = e.starts_at ? new Date(e.starts_at) : null;
  const rawTitle = String(e.title || '');

  const match = rawTitle.match(
    /^(📅|⚽|🍕|🎂|🍻|🏠|🎮|🎉)\s*/u
  );

  const emoji = match ? match[1] : '📅';
  const title = match
    ? rawTitle.slice(match[0].length)
    : rawTitle;

  return `<article class="card">
    <div class="card-top">
      <div>
        <div class="event-date">
          ${date ? date.toLocaleDateString('es-AR', {
            weekday: 'short',
            day: 'numeric',
            month: 'long',
            hour: '2-digit',
            minute: '2-digit'
          }) : 'Fecha a confirmar'}
        </div>
        <h3 style="margin-top:5px">
          ${emoji} ${esc(title)}
        </h3>
        <p class="muted">
          ${esc(e.description || 'Detalles a confirmar')}
        </p>
      </div>
      ${delButton('calendar_events', e.id, e.created_by)}
    </div>
  </article>`;
}
function eventsPage(){
  const today=new Date();
  today.setHours(0,0,0,0);

  const limit=new Date(today);
  limit.setDate(limit.getDate()+15);
  limit.setHours(23,59,59,999);

  const upcoming=[...data.events]
    .filter(e=>{
      if(!e.starts_at)return false;
      const date=new Date(e.starts_at);
      return !isNaN(date.getTime())&&date>=today&&date<=limit;
    })
    .sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));

  return `${heading('Que no se nos pase','Calendario compartido','Un calendario único para los planes de toda la banda.')}<div class="row" style="margin:16px 0"><button class="btn" onclick="go('Crear evento')">＋ Agregar evento</button></div>${calendar()}<div class="section-head"><h2>Todos los eventos</h2></div>${upcoming.length?upcoming.map(eventCard).join(''):empty('📅','No hay próximos eventos','No hay eventos programados para los próximos 15 días.')}`;
}

function calendar(){const [y,m]=calendarMonth.split('-').map(Number),first=new Date(y,m-1,1),offset=(first.getDay()+6)%7,days=new Date(y,m,0).getDate(),labels=['Lu','Ma','Mi','Ju','Vi','Sá','Do'];let cells=labels.map(x=>`<div class="daylabel">${x}</div>`).join('');for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=days;d++){const key=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,has=data.events.some(e=>e.starts_at&&localISO(new Date(e.starts_at))===key);cells+=`<button class="day ${selectedDate===key?'selected':''} ${key===localISO(new Date())?'today':''}" onclick="selectDate('${key}')">${d}${has?'<span class="dot"></span>':''}</button>`}const monthName=first.toLocaleDateString('es-AR',{month:'long',year:'numeric'});const selected=data.events.filter(e=>e.starts_at&&localISO(new Date(e.starts_at))===selectedDate);return `<div class="card"><div class="calendar-head"><button class="btn secondary" onclick="shiftMonth(-1)">‹</button><b style="text-transform:capitalize">${esc(monthName)}</b><button class="btn secondary" onclick="shiftMonth(1)">›</button></div><div class="days">${cells}</div><div class="section-head"><h3>${selectedDate?`Planes del ${fmtDate(selectedDate)}`:'Elegí una fecha'}</h3><button class="btn ghost" onclick="createEventForSelected()">＋</button></div>${selected.length?selected.map(eventCard).join(''):'<p class="subtle">No hay eventos para esta fecha.</p>'}</div>`}
function selectDate(d){selectedDate=d;calendarMonth=d.slice(0,7);render()}
function shiftMonth(n){const [y,m]=calendarMonth.split('-').map(Number);const d=new Date(y,m-1+n,1);calendarMonth=localISO(d).slice(0,7);render()}
function createEventForSelected(){go('Crear evento')}
function createEvent(){
  const emojis = [
    ['📅', 'General'],
    ['⚽', 'Fútbol'],
    ['🍕', 'Comida'],
    ['🎂', 'Cumpleaños'],
    ['🍻', 'Barcito'],
    ['🏠', 'Juntada'],
    ['🎮', 'Juegos'],
    ['🎉', 'Fiesta']
  ];

  return `<button class="back" onclick="go('Calendario')">← Volver</button>

      <input class="field" id="etitle" maxlength="140" required placeholder="Ej.: Fútbol 5">
    </div>

    <div class="formrow">

      <div class="emoji-grid">
        ${emojis.map(([emoji, label], i) => `
          <label class="emoji-option">
            <input type="radio" name="eventEmoji" value="${emoji}" ${i === 0 ? 'checked' : ''}>

      <label for="edate">Fecha y hora</label>
      <input class="field" id="edate" type="datetime-local"
        value="${esc((selectedDate||localISO(new Date()))+'T19:00')}" required>
    </div>

    <div class="formrow">
      <label for="emeta">Detalles (lugar, horario, etc.)</label>
      <textarea class="field" id="emeta" maxlength="1000"
        placeholder="Ej.: 19:00 · La Plaza"></textarea>
    </div>

    <button class="btn full">Guardar evento</button>

async function saveEvent(e) {
  e.preventDefault();

  const emoji = document.querySelector(
    'input[name="eventEmoji"]:checked'
  )?.value || '📅';

  const title = $('etitle').value.trim();
  const starts_at = new Date($('edate').value).toISOString();

  try {
    const { error } = await db.from('calendar_events').insert({
      title: `${emoji} ${title}`,
      description: $('emeta').value.trim() || null,
      starts_at,
      created_by: session.user.id
    });

    if (error) throw error;

    selectedDate = localISO(new Date(starts_at));
    calendarMonth = selectedDate.slice(0, 7);

    toast('¡Evento guardado en el calendario compartido!');
    await refresh();
    page = 'Calendario';
    await render();
  } catch (e) {
    showError(e);
  }
}
function linksPage(){return `${heading('Todo a mano','Enlaces compartidos','Guardá recursos, fixtures, ubicaciones y links útiles para el grupo.')}<div class="row" style="margin:16px 0 20px"><button class="btn" onclick="go('Nuevo enlace')">＋ Agregar enlace</button></div>${data.links.length?data.links.map(l=>`<article class="card"><div class="card-top"><div><h3>🔗 ${esc(l.title)}</h3><p class="linkurl">${esc(l.url)}</p><small>Agregado ${fmtDate((l.created_at||'').slice(0,10))}</small></div>${delButton('shared_links',l.id,l.created_by)}</div><div class="row" style="margin-top:12px"><a class="btn secondary" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Abrir enlace ↗</a></div></article>`).join(''):empty('↗','Todavía no hay enlaces','Compartí el primer recurso útil.','<button class="btn" onclick="go(\'Nuevo enlace\')">Agregar enlace</button>')}`}

const WHEEL_COLORS=['#9b6dff','#5ce1e6','#ff6f91','#ffc861','#6ee7a8','#7b8cff','#ff9f6e','#d77bff'];
const wheel={tab:'girar',loaded:false,loading:false,members:[],custom:[],off:new Set(),spins:[],spinning:false,rotation:0,winner:null};
try{wheel.custom=JSON.parse(localStorage.getItem('bdj-wheel-custom')||'[]')}catch(e){}
function saveWheelCustom(){try{localStorage.setItem('bdj-wheel-custom',JSON.stringify(wheel.custom))}catch(e){}}
function wheelEntries(){return [...wheel.members.map(m=>({key:'m:'+m.id,label:m.full_name||'Integrante',pic:m.avatar_url})),...wheel.custom.map(c=>({key:'c:'+c,label:c,pic:null}))]}
function wheelActive(){return wheelEntries().filter(e=>!wheel.off.has(e.key))}
async function loadWheel(){if(wheel.loading)return;wheel.loading=true;try{const [m,s]=await Promise.all([db.rpc('get_members'),db.from('wheel_spins').select('*').order('created_at',{ascending:false}).limit(1000)]);if(m.error)throw m.error;if(s.error)throw s.error;wheel.members=m.data||[];wheel.spins=s.data||[];wheel.error=null}catch(e){console.error(e);wheel.error=e}wheel.loading=false;wheel.loaded=true;if(page==='Ruleta')await render()}
function wheelSvg(entries){const n=entries.length;if(n<2)return `<div class="wheel-empty">Elegí al menos 2 participantes para girar.</div>`;const seg=360/n,r=150,c=160;const pt=a=>{const t=(a-90)*Math.PI/180;return `${(c+r*Math.cos(t)).toFixed(2)} ${(c+r*Math.sin(t)).toFixed(2)}`};const fs=n>20?9:n>12?11:13;const max=n>20?10:14;return `<svg viewBox="0 0 320 320" class="wheel-svg"><g id="wheelSpin" style="transform:rotate(${wheel.rotation}deg)">${entries.map((e,i)=>{const a0=i*seg,a1=(i+1)*seg,mid=a0+seg/2;const L=WHEEL_COLORS.length,color=WHEEL_COLORS[i===n-1&&n%L===1?1:i%L];const label=e.label.length>max?e.label.slice(0,max-1)+'…':e.label;return `<path d="M${c} ${c} L${pt(a0)} A${r} ${r} 0 ${seg>180?1:0} 1 ${pt(a1)} Z" fill="${color}" stroke="#0d0d15" stroke-width="2"/><text x="${c+r-12}" y="${c}" dy="0.35em" transform="rotate(${mid-90} ${c} ${c})" text-anchor="end" font-size="${fs}" font-weight="700" fill="#14111f">${esc(label)}</text>`}).join('')}</g><circle cx="${c}" cy="${c}" r="22" fill="#151522" stroke="#302d45" stroke-width="3"/><text x="${c}" y="${c+6}" text-anchor="middle" font-size="18">🤘</text></svg>`}
function wheelPage(){if(!wheel.loaded){loadWheel();return `${heading('Herramientas','Ruleta')}<div class="empty">Cargando integrantes…</div>`}const entries=wheelEntries(),active=wheelActive();const w=wheel.winner;return `<button class="back" onclick="go('Herramientas')">← Herramientas</button>${heading('Sorteo','Ruleta 🎡','Elegí quiénes participan, sumá nombres u opciones y girá. El resultado queda guardado para toda la banda.')}<div class="tabs"><button class="${wheel.tab==='girar'?'on':''}" onclick="wheelTab('girar')">🎡 Girar</button><button class="${wheel.tab==='stats'?'on':''}" onclick="wheelTab('stats')">📊 Estadísticas</button></div>${wheel.tab==='stats'?wheelStats():`${wheel.error?`<div class="notice">No se pudo cargar la ruleta. Revisá que el SQL <code>supabase/ruleta.sql</code> esté ejecutado en Supabase.<br><small>Detalle: ${esc(wheel.error.message||wheel.error)}</small><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="wheel.loaded=false;render()">Reintentar</button></div></div>`:''}<div class="card wheel-card"><div class="wheel-wrap"><div class="wheel-pointer">▼</div>${wheelSvg(active)}</div><div id="wheelResult" class="wheel-result ${w?'':'hide'}">${w?`🎉 <b>${esc(w)}</b>`:''}</div><button class="btn full" id="spinBtn" onclick="spinWheel()" ${wheel.spinning||active.length<2?'disabled':''}>${wheel.spinning?'Girando…':'¡Girar!'}</button></div><h2>Participantes <span class="subtle">(${active.length} de ${entries.length})</span></h2><div class="row" style="margin-bottom:10px"><button class="btn secondary" onclick="wheelAll(true)">Marcar todos</button><button class="btn secondary" onclick="wheelAll(false)">Desmarcar todos</button></div><div class="options">${entries.map(e=>`<label class="option"><input type="checkbox" ${wheel.off.has(e.key)?'':'checked'} onchange="wheelToggle(${esc(JSON.stringify(e.key))},this.checked)" ${wheel.spinning?'disabled':''}>${e.pic?`<img class="avatar" style="width:26px;height:26px" src="${esc(e.pic)}" alt="">`:`<span>${e.key.startsWith('c:')?'✏️':'👤'}</span>`}<span style="flex:1">${esc(e.label)}</span>${e.key.startsWith('c:')?`<button type="button" class="pillbtn" onclick="wheelRemove(${esc(JSON.stringify(e.label))})" ${wheel.spinning?'disabled':''}>Quitar</button>`:''}</label>`).join('')}</div><form class="row" style="margin-top:12px" onsubmit="wheelAdd(event)"><input class="field" id="wheelNew" maxlength="40" placeholder="Agregar nombre u opción (ej.: Pizza)" style="flex:1;min-width:0"><button class="btn">＋ Agregar</button></form><p class="subtle">Los nombres agregados a mano quedan guardados solo en este dispositivo.</p><h2 style="margin-top:22px">Historial</h2>${wheel.spins.length?wheel.spins.slice(0,20).map(s=>`<div class="card" style="padding:12px 14px"><div class="card-top"><span>🎉 <b>${esc(s.winner)}</b></span><small>${new Date(s.created_at).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div><small>Girada por ${esc(s.spinner_name||'un integrante')} · entre ${(s.entries||[]).length} opciones</small></div>`).join(''):empty('🎡','Todavía no se giró la ruleta','Cuando alguien la gire, el resultado va a aparecer acá.')}`}`}
async function wheelTab(t){if(wheel.spinning)return;wheel.tab=t;await render()}
function wheelStats(){const spins=wheel.spins;if(!spins.length)return empty('📊','Todavía no hay estadísticas','Cuando la banda gire la ruleta, acá vas a ver quién sale más.');
 const pics=Object.fromEntries(wheel.members.map(m=>[(m.full_name||'').toLowerCase(),m.avatar_url]));
 const count=key=>{const c={};spins.forEach(s=>{const k=key(s);if(k)c[k]=(c[k]||0)+1});return Object.entries(c).sort((a,b)=>b[1]-a[1])};
 const person=(name,extra='')=>{const k=name.toLowerCase();return `<span class="voter">${pics[k]?`<img src="${esc(pics[k])}" alt="">`:k in pics?'<i>👤</i>':'<i>✏️</i>'}${esc(name)}${extra}</span>`};
 const wins=count(s=>s.winner),spinners=count(s=>s.spinner_name),max=wins[0][1],medal=['🥇','🥈','🥉'];
 const winners=new Set(wins.map(w=>w[0].toLowerCase()));const never=wheel.members.filter(m=>!winners.has((m.full_name||'').toLowerCase()));
 let streak=1;while(streak<spins.length&&spins[streak].winner===spins[0].winner)streak++;
 const first=spins[spins.length-1].created_at;
 return `<div class="row" style="margin:4px 0 14px"><span class="tag">🎡 ${spins.length} giros</span><span class="tag">📅 desde el ${esc(new Date(first).toLocaleDateString('es-AR',{day:'numeric',month:'short'}))}</span></div>
 <div class="card"><h3>🏆 Los que más salieron</h3>${wins.slice(0,5).map(([n,c],i)=>`<div class="stat-row"><span class="stat-pos">${medal[i]||(i+1)+'°'}</span>${person(n)}<div class="bar" style="flex:1;margin:0"><span style="width:${Math.round(c/max*100)}%"></span></div><b>${c}</b></div>`).join('')}${wins.length>5?`<small>y ${wins.length-5} más</small>`:''}</div>
 ${streak>1?`<div class="card"><h3>🔥 Racha</h3><p style="margin:0"><b>${esc(spins[0].winner)}</b> salió <b>${streak} veces seguidas</b>. ¿Arreglado? 👀</p></div>`:`<div class="card"><h3>🎯 Último en salir</h3><p style="margin:0">${person(spins[0].winner)} <span class="subtle">· ${esc(fmtDateTime(spins[0].created_at))}</span></p></div>`}
 <div class="card"><h3>🍀 Nunca salieron</h3>${never.length?`<div class="voters">${never.map(m=>person(m.full_name||'Integrante')).join('')}</div>`:'<p class="muted" style="margin:0">¡Todos salieron al menos una vez!</p>'}</div>
 <div class="card"><h3>🎡 Los que más giran</h3>${spinners.slice(0,3).map(([n,c],i)=>`<div class="stat-row"><span class="stat-pos">${medal[i]}</span>${person(n)}<span class="subtle" style="margin-left:auto">${c} ${c===1?'giro':'giros'}</span></div>`).join('')}</div>`}
async function wheelToggle(key,on){if(on)wheel.off.delete(key);else wheel.off.add(key);wheel.winner=null;await render()}
async function wheelAll(on){if(on)wheel.off.clear();else wheelEntries().forEach(e=>wheel.off.add(e.key));wheel.winner=null;await render()}
async function wheelAdd(e){e.preventDefault();const v=$('wheelNew').value.trim();if(!v)return;if(wheelEntries().some(x=>x.label.toLowerCase()===v.toLowerCase()))return toast('Ese nombre ya está en la ruleta.');wheel.custom.push(v);saveWheelCustom();wheel.winner=null;await render();$('wheelNew')?.focus()}
async function wheelRemove(label){wheel.custom=wheel.custom.filter(c=>c!==label);wheel.off.delete('c:'+label);saveWheelCustom();wheel.winner=null;await render()}
async function spinWheel(){const active=wheelActive();if(wheel.spinning||active.length<2)return;const labels=active.map(e=>e.label);wheel.spinning=true;wheel.winner=null;await render();try{
 // El ganador lo elige la base de datos, así nadie puede elegirlo a mano.
 const {data:row,error}=await db.rpc('spin_wheel',{p_entries:labels});if(error)throw error;const spin=Array.isArray(row)?row[0]:row;
 const idx=Math.max(0,(spin.entries||labels).indexOf(spin.winner)),seg=360/labels.length,jitter=(Math.random()-.5)*seg*.6;
 const target=360-(idx+.5)*seg+jitter;const base=wheel.rotation-(((wheel.rotation%360)+360)%360);wheel.rotation=base+360*6+target;
 const g=$('wheelSpin');if(g){g.style.transition='transform 4.5s cubic-bezier(.17,.67,.12,1)';requestAnimationFrame(()=>{g.style.transform=`rotate(${wheel.rotation}deg)`})}
 await new Promise(r=>setTimeout(r,4700));wheel.spins=[spin,...wheel.spins];wheel.winner=spin.winner;toast(`🎉 ¡Salió ${spin.winner}!`)
}catch(e){showError(e)}wheel.spinning=false;await render()}

const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2,minimumFractionDigits:0}).format(Math.round(n*100)/100);
const exp={loaded:false,loading:false,list:[],members:[],error:null,current:null,adding:false,creating:false};
// Saldo de cada integrante: positivo = le deben, negativo = debe.
function expBalances(a){const b={};a.members.forEach(m=>b[m.id]=0);a.expenses.forEach(e=>{const share=e.amount/e.split.length;b[e.paid_by]=(b[e.paid_by]||0)+e.amount;e.split.forEach(id=>b[id]=(b[id]||0)-share)});a.payments.forEach(p=>{b[p.from]=(b[p.from]||0)+p.amount;b[p.to]=(b[p.to]||0)-p.amount});return b}
// Arma la menor cantidad de pagos posible: el que más debe le paga al que más le deben.
function expSettle(a){const b=expBalances(a),deb=[],cred=[];Object.entries(b).forEach(([id,v])=>{v=Math.round(v*100)/100;if(v<-0.009)deb.push({id,v:-v});else if(v>0.009)cred.push({id,v})});deb.sort((x,y)=>y.v-x.v);cred.sort((x,y)=>y.v-x.v);const out=[];let i=0,j=0;while(i<deb.length&&j<cred.length){const amt=Math.min(deb[i].v,cred[j].v);out.push({from:deb[i].id,to:cred[j].id,amount:Math.round(amt*100)/100});deb[i].v-=amt;cred[j].v-=amt;if(deb[i].v<0.01)i++;if(cred[j].v<0.01)j++}return out}
function expMember(a,id){return a.members.find(m=>m.id===id)||{id,name:'Integrante'}}
function expChip(m){return `<span class="voter">${m.avatar_url?`<img src="${esc(m.avatar_url)}" alt="">`:'<i>👤</i>'}${esc(m.id===session?.user?.id?'Vos':m.name)}</span>`}
function expTotal(a){return a.expenses.reduce((s,e)=>s+e.amount,0)}
function expMine(a){return Math.round((expBalances(a)[session.user.id]||0)*100)/100}
function expMineLabel(a){const v=expMine(a);return Math.abs(v)<0.01?'<span class="subtle">Estás al día ✅</span>':v>0?`<b class="pos">Te deben ${money(v)}</b>`:`<b class="neg">Debés ${money(-v)}</b>`}
function expCard(a){const settled=!expSettle(a).length&&a.expenses.length;return `<article class="card"><div class="card-top"><div><span class="tag">${settled?'✅ Saldada':'💸 Abierta'}</span><h3 style="margin-top:10px">${esc(a.title)}</h3></div><b style="font-size:18px">${money(expTotal(a))}</b></div><small>${a.expenses.length} ${a.expenses.length===1?'gasto':'gastos'} · ${a.members.length} personas</small><div class="row" style="margin-top:12px;justify-content:space-between">${expMineLabel(a)}<button class="btn" onclick="expOpen('${a.id}')">Ver cuentas</button></div></article>`}
function expCreateForm(){return `<form class="card" onsubmit="expCreate(event)"><h3>Nueva cuenta</h3><div class="formrow"><label for="exTitle">Nombre</label><input class="field" id="exTitle" maxlength="80" required placeholder="Ej.: 🔥 Asado del sábado"></div><div class="formrow"><label>¿Quiénes participan?</label><div class="options" id="exPeople">${exp.members.map(m=>`<label class="option"><input type="checkbox" value="${esc(m.id)}" checked>${expChip({id:m.id,name:m.full_name||'Integrante',avatar_url:m.avatar_url})}</label>`).join('')}</div></div><div class="row"><button class="btn">Crear cuenta</button><button type="button" class="btn secondary" onclick="exp.creating=false;render()">Cancelar</button></div></form>`}
function expListPage(){return `<button class="back" onclick="go('Herramientas')">← Herramientas</button>${heading('Cuentas claras','Gastos compartidos 💸','Cargá lo que pagó cada uno y la página calcula quién le paga a quién.')}${exp.error?`<div class="notice">No se pudieron cargar los gastos. Revisá que el SQL <code>supabase/gastos.sql</code> esté ejecutado en Supabase.<br><small>Detalle: ${esc(exp.error.message||exp.error)}</small><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="exp.loaded=false;render()">Reintentar</button></div></div>`:''}${exp.creating?expCreateForm():`<div class="row" style="margin:16px 0 20px"><button class="btn" onclick="exp.creating=true;render()">＋ Nueva cuenta</button></div>`}${exp.list.length?exp.list.map(expCard).join(''):empty('💸','Todavía no hay cuentas','Creá una para la próxima juntada.')}`}
function expDetailPage(){const a=exp.list.find(x=>x.id===exp.current);if(!a){exp.current=null;return expListPage()}const b=expBalances(a),moves=expSettle(a),total=expTotal(a);
 return `<button class="back" onclick="exp.current=null;render()">← Gastos</button>${heading('Cuenta',a.title)}
 <div class="tiles" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px"><div class="card" style="margin:0"><small>Total gastado</small><div style="font-size:22px;font-weight:800">${money(total)}</div></div><div class="card" style="margin:0"><small>Tu saldo</small><div style="font-size:16px;margin-top:4px">${expMineLabel(a)}</div></div></div>
 <div class="card"><h3>🤝 Quién le paga a quién</h3>${moves.length?moves.map(m=>`<div class="pay-row"><div class="row" style="gap:6px;flex:1">${expChip(expMember(a,m.from))}<span>→</span>${expChip(expMember(a,m.to))}</div><b>${money(m.amount)}</b>${m.from===session.user.id||m.to===session.user.id||isAdmin?`<button class="pillbtn" onclick="expPaid('${a.id}','${m.from}','${m.to}',${m.amount})">✓ Pagado</button>`:''}</div>`).join(''):'<p class="muted" style="margin:0">🎉 ¡Están todos al día!</p>'}</div>
 <div class="card"><h3>📊 Cómo queda cada uno</h3>${a.members.map(m=>{const v=Math.round((b[m.id]||0)*100)/100;return `<div class="pay-row">${expChip(m)}<span style="margin-left:auto" class="${v>0.009?'pos':v<-0.009?'neg':'subtle'}">${v>0.009?'le deben '+money(v):v<-0.009?'debe '+money(-v):'al día'}</span></div>`}).join('')}</div>
 <div class="section-head"><h2>🧾 Gastos</h2><button class="btn" onclick="exp.adding=true;render()">＋ Agregar gasto</button></div>
 ${exp.adding?expForm(a):''}
 ${a.expenses.length?a.expenses.map(e=>`<div class="card" style="padding:12px 14px"><div class="card-top"><div><b>${esc(e.description)}</b><div class="subtle" style="margin-top:3px">Pagó ${esc(e.paid_by===session.user.id?'vos':expMember(a,e.paid_by).name)} · entre ${e.split.length===a.members.length?'todos':e.split.length+' personas'}</div></div><b>${money(e.amount)}</b></div>${e.created_by===session.user.id||isAdmin?`<div class="row" style="margin-top:8px;justify-content:flex-end"><button class="pillbtn" onclick="expDelExpense('${e.id}')">🗑 Borrar</button></div>`:''}</div>`).join(''):empty('🧾','Sin gastos todavía','Agregá el primero.')}
 ${a.payments.length?`<h2 style="margin-top:20px">✅ Pagos registrados</h2>${a.payments.map(p=>`<div class="card" style="padding:10px 14px"><div class="pay-row" style="margin:0">${expChip(expMember(a,p.from))}<span>pagó</span><b>${money(p.amount)}</b><span>a</span>${expChip(expMember(a,p.to))}${[p.from,p.to,p.created_by].includes(session.user.id)||isAdmin?`<button class="pillbtn" style="margin-left:auto" onclick="expDelPayment('${p.id}')">Deshacer</button>`:''}</div></div>`).join('')}`:''}${a.created_by===session.user.id||isAdmin?`<div class="row" style="margin-top:20px"><button class="btn danger" onclick="expDelAccount('${a.id}')">Eliminar cuenta</button></div>`:''}`}
function expForm(a){return `<form class="card" onsubmit="expAdd(event,'${a.id}')"><h3>Nuevo gasto</h3><div class="formrow"><label for="exDesc">¿Qué se pagó?</label><input class="field" id="exDesc" maxlength="80" required placeholder="Ej.: Carne y carbón"></div><div class="formrow"><label for="exAmount">Monto ($)</label><input class="field" id="exAmount" type="number" min="1" step="0.01" inputmode="decimal" required placeholder="30000"></div><div class="formrow"><label for="exPaid">¿Quién pagó?</label><select class="field" id="exPaid">${a.members.map(m=>`<option value="${esc(m.id)}" ${m.id===session.user.id?'selected':''}>${esc(m.id===session.user.id?'Yo ('+m.name+')':m.name)}</option>`).join('')}</select></div><div class="formrow"><label>¿Entre quiénes se divide?</label><div class="options" id="exSplit">${a.members.map(m=>`<label class="option"><input type="checkbox" value="${esc(m.id)}" checked>${expChip(m)}</label>`).join('')}</div></div><div class="row"><button class="btn">Guardar gasto</button><button type="button" class="btn secondary" onclick="exp.adding=false;render()">Cancelar</button></div></form>`}
async function loadExp(){if(exp.loading)return;exp.loading=true;try{const [st,mem]=await Promise.all([db.rpc('ex_state'),db.rpc('get_members')]);if(st.error)throw st.error;if(mem.error)throw mem.error;exp.list=(st.data||[]).map(a=>({...a,expenses:a.expenses.map(e=>({...e,amount:Number(e.amount)})),payments:a.payments.map(x=>({...x,amount:Number(x.amount)}))}));exp.members=mem.data||[];exp.error=null}catch(e){console.error(e);exp.error=e}exp.loading=false;exp.loaded=true;if(page==='Gastos')await render()}
async function expRun(fn,args,ok){try{const {error}=await db.rpc(fn,args);if(error)throw error;if(ok)toast(ok);exp.loaded=false;await loadExp()}catch(e){showError(e)}}
function expensesPage(){if(!exp.loaded){loadExp();return `<button class="back" onclick="go('Herramientas')">← Herramientas</button>${heading('Cuentas claras','Gastos compartidos 💸')}<div class="empty">Cargando…</div>`}return exp.current?expDetailPage():expListPage()}
async function expCreate(e){e.preventDefault();const ids=[...document.querySelectorAll('#exPeople input:checked')].map(x=>x.value);if(ids.length<2)return toast('Elegí al menos 2 personas.');exp.creating=false;await expRun('ex_create_account',{p_title:$('exTitle').value.trim(),p_user_ids:ids},'¡Cuenta creada!')}
async function expAdd(e,id){e.preventDefault();const amount=Number(String($('exAmount').value).replace(',','.'));if(!(amount>0))return toast('Poné un monto mayor a cero.');const split=[...document.querySelectorAll('#exSplit input:checked')].map(x=>x.value);if(!split.length)return toast('Elegí entre quiénes se divide.');exp.adding=false;await expRun('ex_add_expense',{p_account_id:id,p_description:$('exDesc').value.trim(),p_amount:amount,p_paid_by:$('exPaid').value,p_split:split},'Gasto cargado.')}
async function expPaid(id,from,to,amount){const a=exp.list.find(x=>x.id===id);if(!confirm(`¿Confirmás que ${expMember(a,from).name} le pagó ${money(amount)} a ${expMember(a,to).name}?`))return;await expRun('ex_add_payment',{p_account_id:id,p_from:from,p_to:to,p_amount:amount},'Pago registrado ✅')}
async function expDelExpense(id){if(!confirm('¿Borrar este gasto?'))return;await expRun('ex_delete_expense',{p_expense_id:id},'Gasto borrado.')}
async function expDelPayment(id){if(!confirm('¿Deshacer este pago?'))return;await expRun('ex_delete_payment',{p_payment_id:id},'Pago deshecho.')}
async function expDelAccount(id){if(!confirm('¿Eliminar esta cuenta con todos sus gastos y pagos?'))return;exp.current=null;await expRun('ex_delete_account',{p_account_id:id},'Cuenta eliminada.')}
async function expOpen(id){exp.current=id;exp.adding=false;await render();scrollTo(0,0)}

// ---------- Truco ----------
const truco={tab:'anotador'};
async function trucoTab(t){truco.tab=t;await render()}
function trucoPage(){return `<button class="back" onclick="go('Herramientas')">← Herramientas</button>${heading('Mesa de truco','Truco 🃏')}<div class="tabs"><button class="${truco.tab==='anotador'?'on':''}" onclick="trucoTab('anotador')">📝 Anotador</button><button class="${truco.tab==='reglas'?'on':''}" onclick="trucoTab('reglas')">📖 Reglas</button><button class="${truco.tab==='torneos'?'on':''}" onclick="trucoTab('torneos')">🏆 Torneos</button></div>${truco.tab==='reglas'?trucoRules():truco.tab==='torneos'?tourPage():scorePage()}`}

// Anotador: se guarda en este dispositivo para no perder la partida si se cierra la página.
const score=(()=>{const d={a:0,b:0,nameA:'Nos',nameB:'Ellos',target:30,log:[]};try{return {...d,...JSON.parse(localStorage.getItem('bdj-truco')||'{}')}}catch(e){return d}})();
function scoreSave(){try{localStorage.setItem('bdj-truco',JSON.stringify(score))}catch(e){}}
// Un cuadradito de fósforos: 1 izquierda, 2 arriba, 3 derecha, 4 abajo, 5 diagonal.
function matchBox(n){const S=[[10,52,10,10],[10,10,52,10],[52,10,52,52],[52,52,10,52],[14,48,48,14]];return `<svg viewBox="0 0 62 62" class="match-box">${S.slice(0,n).map(([x1,y1,x2,y2])=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ead2a4" stroke-width="4.5" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="3.6" fill="#c8372d"/>`).join('')}</svg>`}
function matchColumn(points,from,to){let out='';for(let p=from;p<to;p+=5){const n=Math.max(0,Math.min(5,points-p));out+=`<div class="match-slot">${n?matchBox(n):''}</div>`}return out}
function scoreHalf(from,to){return `<div class="score-half"><div class="score-col">${matchColumn(score.a,from,to)}</div><div class="score-col">${matchColumn(score.b,from,to)}</div></div>`}
function scorePage(){const half=score.target/2,winner=score.a>=score.target?score.nameA:score.b>=score.target?score.nameB:null;
 const status=t=>{const v=score[t];return v>=score.target?'🏆 ¡Ganó!':score.target===15?`${v} ${v===1?'punto':'puntos'}`:v>half?`${v-half} buenas`:v===half?'¡15! Entra a las buenas':`${v} malas`};
 return `<div class="wood"><div class="score-head"><div><input class="score-name" value="${esc(score.nameA)}" maxlength="14" onchange="scoreName('nameA',this.value)" aria-label="Nombre del equipo 1"><small>${status('a')}</small></div><div><input class="score-name" value="${esc(score.nameB)}" maxlength="14" onchange="scoreName('nameB',this.value)" aria-label="Nombre del equipo 2"><small>${status('b')}</small></div></div>
 <div class="score-board"><div class="score-btns"><button class="round-btn" onclick="scoreAdd('a',1)" aria-label="Sumar a ${esc(score.nameA)}">＋</button><button class="round-btn" onclick="scoreAdd('a',-1)" aria-label="Restar a ${esc(score.nameA)}">－</button></div>
 <div class="score-grid">${score.target===15?scoreHalf(0,15):`${scoreHalf(0,half)}<div class="score-line"><span>${half}</span></div>${scoreHalf(half,score.target)}`}</div>
 <div class="score-btns"><button class="round-btn" onclick="scoreAdd('b',1)" aria-label="Sumar a ${esc(score.nameB)}">＋</button><button class="round-btn" onclick="scoreAdd('b',-1)" aria-label="Restar a ${esc(score.nameB)}">－</button></div></div>
 ${winner?`<div class="score-win">🏆 ¡Ganó ${esc(winner)}! ${score.a}–${score.b}</div>`:''}
 <div class="score-foot"><button class="wood-btn" onclick="scoreUndo()" ${score.log.length?'':'disabled'}>↩ Deshacer</button><button class="wood-btn" onclick="scoreTarget()">A ${score.target===30?15:30}</button><button class="wood-btn main" onclick="scoreNew()">Nuevo partido</button></div></div>`}
async function scoreAdd(t,d){const v=Math.max(0,Math.min(score.target,score[t]+d));if(v===score[t])return;score.log.push([t,score[t]]);score[t]=v;scoreSave();if(navigator.vibrate)navigator.vibrate(15);await render()}
async function scoreUndo(){const last=score.log.pop();if(!last)return;score[last[0]]=last[1];scoreSave();await render()}
async function scoreNew(){if((score.a||score.b)&&!confirm('¿Empezar un partido nuevo? Se borra el actual.'))return;score.a=0;score.b=0;score.log=[];scoreSave();await render()}
async function scoreTarget(){if((score.a||score.b)&&!confirm(`¿Cambiar a partido a ${score.target===30?15:30}? Se reinicia el puntaje.`))return;score.target=score.target===30?15:30;score.a=0;score.b=0;score.log=[];scoreSave();await render()}
async function scoreName(k,v){score[k]=v.trim()||(k==='nameA'?'Nos':'Ellos');scoreSave();await render()}

function trucoRules(){const sec=(t,b,open)=>`<details class="card rule" ${open?'open':''}><summary>${t}</summary><div class="rule-body">${b}</div></details>`;
 return `<p class="muted">Las reglas cambian un poco según la mesa: esto es lo más común. Ante la duda, manda la casa. 😄</p>
 ${sec('🃏 Las cartas y cuáles matan',`<p>Se juega con <b>baraja española de 40 cartas</b> (sin 8 ni 9). De la más alta a la más baja:</p><ol class="rank"><li><b>Ancho de espadas</b> (1🗡)</li><li><b>Ancho de bastos</b> (1🪵)</li><li><b>7 de espadas</b></li><li><b>7 de oro</b></li><li>Todos los <b>3</b></li><li>Todos los <b>2</b></li><li><b>Anchos falsos</b> (1 de copa y 1 de oro)</li><li>Los <b>12</b>, después los <b>11</b> y los <b>10</b></li><li><b>Sietes falsos</b> (7 de copa y 7 de bastos)</li><li>Los <b>6</b>, los <b>5</b> y los <b>4</b></li></ol><p>Cartas del mismo valor empatan ("parda").</p>`,true)}
 ${sec('🎮 Cómo se juega una ronda',`<ul><li>Se reparten <b>3 cartas</b> a cada uno. Se juega en 1 vs 1, 2 vs 2 o 3 vs 3.</li><li>Cada ronda tiene <b>3 manos</b>: gana la ronda quien gana 2.</li><li><b>Parda:</b> si se empata la primera, gana quien gane la segunda. Si se empata otra mano, define la primera que no fue parda. Si todas son pardas, gana el que es mano.</li><li>Ser <b>"mano"</b> es jugar primero; va rotando cada ronda.</li><li>Si nadie canta nada, la ronda vale <b>1 punto</b>.</li></ul>`)}
 ${sec('💬 Envido',`<p>Se canta <b>solo en la primera mano</b>, antes de que el que canta tire su carta.</p><p><b>Cómo se cuenta:</b> dos cartas del mismo palo suman su valor <b>+ 20</b>. Las figuras (10, 11, 12) valen 0. Si no tenés dos del mismo palo, vale la carta más alta (máximo 7). El máximo es <b>33</b> (7 + 6 + 20).</p><table class="rtable"><tr><th>Canto</th><th>Querido</th><th>No querido</th></tr><tr><td>Envido</td><td>2</td><td>1</td></tr><tr><td>Real envido</td><td>3</td><td>1</td></tr><tr><td>Envido + envido</td><td>4</td><td>2</td></tr><tr><td>Envido + real envido</td><td>5</td><td>2</td></tr><tr><td>Envido + envido + real</td><td>7</td><td>4</td></tr><tr><td>Falta envido</td><td>Lo que le falta al que va ganando para ganar el partido</td><td>Lo cantado antes (o 1)</td></tr></table><p>Si empatan los tantos, gana el que es mano.</p>`)}
 ${sec('🔥 Truco',`<p>Se puede cantar en cualquier momento de la ronda. Si se acepta, la ronda vale más; si no se quiere, el que cantó se lleva los puntos y se termina la ronda.</p><table class="rtable"><tr><th>Canto</th><th>Querido</th><th>No querido</th></tr><tr><td>Truco</td><td>2</td><td>1</td></tr><tr><td>Quiero retruco</td><td>3</td><td>2</td></tr><tr><td>Quiero vale cuatro</td><td>4</td><td>3</td></tr></table><p>Solo puede subir la apuesta el que <b>aceptó</b> la última. Irse al mazo en cualquier momento le da al rival los puntos en juego.</p>`)}
 ${sec('🌸 Flor (si se juega con flor)',`<ul><li>Flor es tener <b>las 3 cartas del mismo palo</b>. Se canta en la primera mano y anula el envido.</li><li><b>Flor:</b> 3 puntos.</li><li><b>Contraflor:</b> si el rival también tiene flor, gana la de más tantos: 6 puntos.</li><li><b>Contraflor al resto:</b> se juega lo que falta para ganar el partido.</li><li>Antes de empezar, pónganse de acuerdo: <b>¿con flor o sin flor?</b></li></ul>`)}
 ${sec('📏 Puntaje',`<ul><li>Se juega a <b>30 puntos</b> (o a 15 si es rápido).</li><li>A 30 se divide en <b>malas</b> (los primeros 15) y <b>buenas</b> (los otros 15).</li><li>Se anota con fósforos en cuadraditos de 5: cuatro lados y una diagonal.</li></ul>`)}
 ${sec('🤫 Señas (2 vs 2 y 3 vs 3)',`<p>Para pasarle información al compañero sin que el rival se dé cuenta:</p><ul><li><b>Ancho de espadas:</b> levantar las cejas.</li><li><b>Ancho de bastos:</b> guiñar un ojo.</li><li><b>7 de espadas:</b> torcer la boca a la derecha.</li><li><b>7 de oro:</b> torcer la boca a la izquierda.</li><li><b>3:</b> morder el labio.</li><li><b>2:</b> trompita, como tirando un beso.</li><li><b>Ancho falso:</b> abrir apenas la boca.</li><li><b>Nada (ciego):</b> cerrar los ojos.</li><li><b>Flor:</b> inflar los cachetes.</li></ul>`)}`}

// ---------- Torneos ----------
const tour={list:[],current:null,creating:false};
const tourTeamName=t=>t.name||t.players.join(' y ');
function tourRoundName(i,total){const left=total-i;return left===1?'Final':left===2?'Semifinal':left===3?'Cuartos':`Ronda ${i+1}`}
function tourMatch(t,m){const A=t.teams[m.a],B=m.b==null?null:t.teams[m.b];const side=(team,idx,pts)=>team?`<div class="tm-team ${m.winner===idx?'win':m.winner!=null?'lose':''}"><span>${m.winner===idx?'🏆 ':''}${esc(tourTeamName(team))}</span>${pts!=null?`<b>${pts}</b>`:''}</div>`:'<div class="tm-team tbd"><span>A definir</span></div>';
 if(m.a!=null&&m.b===null&&m.bye)return `<div class="tm"><div class="tm-team win"><span>${esc(tourTeamName(A))}</span></div><div class="tm-bye">pasa directo</div></div>`;
 return `<div class="tm">${A?side(A,m.a,m.ptsA):side(null)}${side(B,m.b,m.ptsB)}${A&&B&&m.winner==null?`<div class="row" style="gap:6px;margin-top:8px"><button class="pillbtn">Cargar resultado</button><button class="pillbtn">📝 Anotar</button></div>`:''}</div>`}
function tourDetail(t){const champ=t.champion!=null?t.teams[t.champion]:null;
 return `<button class="back" onclick="tour.current=null;render()" style="margin-top:4px">← Torneos</button><h2 style="margin-bottom:6px">${esc(t.title)}</h2><div class="row" style="gap:6px;margin-bottom:14px"><span class="tag">${t.mode}</span><span class="tag">${t.format==='llaves'?'🏆 Eliminación directa':'🔁 Todos contra todos'}</span><span class="tag">A ${t.target}</span></div>
 ${champ?`<div class="card" style="text-align:center"><div style="font-size:34px">🏆</div><b>Campeones</b><h2 style="margin:4px 0 0">${esc(tourTeamName(champ))}</h2></div>`:''}
 <div class="card"><h3>👥 Equipos</h3>${t.teams.map((x,i)=>`<div class="pay-row"><span class="tag">${i+1}</span><b>${esc(tourTeamName(x))}</b>${x.name?`<span class="subtle">${esc(x.players.join(' · '))}</span>`:''}</div>`).join('')}</div>
 <h3>🗂 Llaves</h3><div class="bracket">${t.rounds.map((r,i)=>`<div class="b-round"><div class="b-title">${tourRoundName(i,t.rounds.length)}</div>${r.map(m=>tourMatch(t,m)).join('')}</div>`).join('')}</div>`}
function tourForm(){const people=['Nico','Jero','Lucas','Tobi','Fede','Santi','Juan','Mati'];return `<form class="card" onsubmit="event.preventDefault()"><h3>Nuevo torneo</h3><div class="formrow"><label>Nombre</label><input class="field" value="Torneo de los viernes"></div>
 <div class="formrow"><label>Modalidad</label><div class="seg"><button type="button">1 vs 1</button><button type="button" class="on">2 vs 2</button><button type="button">3 vs 3</button></div></div>
 <div class="formrow"><label>Formato</label><div class="seg"><button type="button" class="on">🏆 Llaves</button><button type="button">🔁 Todos contra todos</button></div></div>
 <div class="formrow"><label>Partidos a</label><div class="seg"><button type="button">15</button><button type="button" class="on">30</button></div></div>
 <div class="formrow"><label>Jugadores (${people.length})</label><div class="voters">${people.map(p=>`<span class="voter"><i>✓</i>${p}</span>`).join('')}</div><div class="row" style="margin-top:8px"><input class="field" placeholder="Agregar a alguien sin cuenta" style="flex:1;min-width:0"><button type="button" class="btn secondary">＋</button></div></div>
 <div class="formrow"><label>Equipos</label><div class="seg"><button type="button" class="on">🎲 Sortear parejas</button><button type="button">✋ Armar a mano</button></div><small>8 jugadores → 4 parejas. Si sobra alguien, te avisa antes de crear.</small></div>
 <button class="btn full">Crear torneo</button></form>`}
function tourPage(){const t=tour.list.find(x=>x.id===tour.current);if(t)return tourDetail(t);return `${tour.creating?tourForm():`<div class="row" style="margin:4px 0 16px"><button class="btn" onclick="tour.creating=true;render()">＋ Nuevo torneo</button></div>`}${tour.list.map(x=>`<article class="card"><div class="card-top"><div><span class="tag">${x.champion!=null?'🏆 Terminado':'🔥 En juego'}</span><h3 style="margin-top:10px">${esc(x.title)}</h3></div></div><small>${x.mode} · ${x.teams.length} equipos · ${x.format==='llaves'?'llaves':'liga'}</small>${x.champion!=null?`<p style="margin:8px 0 0">🏆 <b>${esc(tourTeamName(x.teams[x.champion]))}</b></p>`:''}<div class="row" style="margin-top:12px"><button class="btn" onclick="tour.current='${x.id}';render()">Ver torneo</button></div></article>`).join('')}`}

function menuPage(){return `${heading('Configuración','Cuenta y acceso','Información de tu sesión en Banda del Jagger.')}<div class="card">${profileLine()}<div class="notice">Tu cuenta de Google identifica tus publicaciones y evita votos duplicados. La app no necesita acceso a tu correo ni a tus archivos.</div>${isAdmin?'<p class="admin-label">Tenés permisos de administrador.</p>':''}<button class="btn secondary full" style="margin-top:14px" onclick="signOut()">Cerrar sesión</button></div>`}
function profileLine(){const u=session.user;return `<div class="profileline">${u.user_metadata?.avatar_url?`<img class="avatar" src="${esc(u.user_metadata.avatar_url)}" alt="">`:'<div class="avatar" style="display:grid;place-items:center">👤</div>'}<div><b>${esc(u.user_metadata?.full_name||u.email||'Integrante')}</b><div class="subtle">${esc(u.email||'Cuenta de Google')}</div></div></div>`}
function loginPage(){return `<div class="loginbox"><section class="hero"><div class="eyebrow">Tu grupo, más organizado</div><h1>Banda del Jagger 🤘</h1><p>Votaciones, propuestas, calendario y enlaces en un solo lugar. Iniciá sesión con Google para participar.</p><button class="gbtn" onclick="signIn()">🌐 Continuar con Google</button></section><div class="notice">El acceso está limitado a personas que inicien sesión. No compartas claves privadas ni tokens. Si aparece un error, revisá la configuración de Google OAuth y las URL permitidas de Supabase.</div></div>`}
async function render(){if(!CONFIGURED){$('main').innerHTML=`${heading('Configuración pendiente','Conectemos Supabase','El sitio ya tiene el diseño y la estructura. Falta pegar la publishable key pública del proyecto para habilitar el inicio de sesión y la base de datos.')}<div class="card"><h3>Un paso antes de publicar</h3><ol><li>Abrí el archivo <b>index.html</b> con un editor.</li><li>Buscá <code>PEGAR_AQUI_TU_PUBLISHABLE_KEY</code>.</li><li>Reemplazá solamente ese texto por la publishable key de Supabase (la pública, no una secret key).</li><li>Guardá el archivo y subilo a GitHub.</li></ol><div class="notice">Nunca pegues aquí ni en el archivo una clave <code>service_role</code> o una secret key.</div></div>`;return}if(!session){$('main').innerHTML=loginPage();return}
 let view='';try{switch(page){case'Inicio':view=home();break;case'Votaciones':view=pollsPage();break;case'Crear votación':view=createPoll();break;case'Detalle':view=pollDetail();break;case'Herramientas':view=toolsPage();break;case'Ruleta':view=wheelPage();break;case'Amigo invisible':view=santaPage();break;case'Gastos':view=expensesPage();break;case'Truco':view=trucoPage();break;case'Propuestas':view=proposalsPage();break;case'Nueva propuesta':view=createIdea();break;case'Calendario':view=eventsPage();break;case'Crear evento':view=createEvent();break;case'Enlaces':view=linksPage();break;case'Nuevo enlace':view=createLink();break;case'Menú':view=menuPage();break;default:page='Inicio';view=home()}}catch(e){console.error(e);view=`<div class="empty">No se pudo mostrar esta sección. ${esc(e.message)}</div>`}$('main').innerHTML=view;nav()}
async function init(){if(!CONFIGURED){userArea();nav();await render();return}if(!window.supabase){$('main').innerHTML=empty('⚠️','No se pudo cargar Supabase','Revisá tu conexión a internet e intentá de nuevo.');return}db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data:res,error}=await db.auth.getSession();if(error)console.warn(error);session=res?.session||null;await refresh();db.auth.onAuthStateChange((_event,newSession)=>{session=newSession;setTimeout(()=>refresh(),0)})}
nav();init();
</script>
</body>
</html>
